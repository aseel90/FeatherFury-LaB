<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feather Fury - Simple Hero Preview</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17365f 0,#0a1626 42%,#050a12 100%);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#fff}main{max-width:980px;margin:auto;padding:28px 16px 50px}.head{text-align:center;margin-bottom:22px}.head h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px);font-weight:950}.head p{margin:0;color:#b9c7d8}.panel{background:linear-gradient(180deg,rgba(18,33,54,.98),rgba(9,18,31,.98));border:1px solid #273950;border-radius:26px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.3)}.stage{min-height:430px;border-radius:22px;background:radial-gradient(circle at 55% 35%,rgba(62,139,237,.23),rgba(7,13,22,.3) 52%,rgba(3,8,14,.5));display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.05);position:relative}.stage:after{content:"";position:absolute;bottom:62px;width:220px;height:28px;background:rgba(0,0,0,.28);filter:blur(9px);border-radius:50%}.hero{width:min(560px,88vw);height:auto;filter:drop-shadow(0 18px 20px rgba(0,0,0,.35));position:relative;z-index:2;transform-origin:center;transition:.24s ease}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid #38506f;background:#14243a;color:#fff;padding:10px 16px;border-radius:999px;font-weight:850;cursor:pointer}.btn.active{background:#f8c44f;color:#201700;border-color:#ffe18c}.notes{margin-top:16px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.tag{padding:8px 11px;border-radius:999px;background:#0d1a2b;border:1px solid #2a3d57;color:#cbd5e1;font-size:13px}.back{display:inline-block;margin-top:18px;color:#fff;text-decoration:none;background:#1d2c42;border:1px solid #344a68;padding:10px 15px;border-radius:12px}@media(max-width:600px){.stage{min-height:340px}.panel{padding:12px}}</style></head><body><main><div class="head"><h1>الشكل المبسّط الجديد</h1><p>بدون أقدام، بدون جناح منفصل — فقط مظهر جناح داخل كتلة الجسم.</p></div><section class="panel"><div class="stage"><svg id="hero" class="hero" viewBox="0 0 620 430" role="img" aria-label="Blue ninja bird"><defs><linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1994ff"/><stop offset="1" stop-color="#0c60c8"/></linearGradient><linearGradient id="bellyG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ac8ff"/><stop offset="1" stop-color="#5da3e8"/></linearGradient></defs><g stroke="#020813" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"><path id="tail" fill="#0d68cf" d="M145 248 C108 235 94 256 112 276 C87 278 84 304 112 308 C104 328 129 342 151 324 C168 334 190 321 187 300 C210 303 222 280 203 266 C196 252 170 244 145 248Z"/><ellipse id="body" fill="url(#bodyG)" cx="330" cy="220" rx="188" ry="142"/><path id="crest" fill="#1589ee" d="M230 95 C215 45 254 26 294 65 C302 28 347 20 376 67 C402 40 444 59 449 103 C408 95 374 105 348 126 C314 105 274 97 230 95Z"/><path id="band" fill="#071c4b" d="M168 159 C262 129 397 131 496 163 L490 213 C397 191 278 191 172 207Z"/><path fill="#071c4b" d="M173 171 94 135 119 185 171 192Z"/><path fill="#071c4b" d="M171 192 94 229 129 248 177 208Z"/><path id="eye" fill="#fff" d="M369 166 C417 153 463 167 490 195 C460 234 411 244 366 225 C352 206 353 183 369 166Z"/><path id="beakTop" fill="#ffd34a" d="M486 213 585 232 493 267Z"/><path id="beakBottom" fill="#f2a914" d="M493 267 585 232 502 291Z"/><path id="wingMark" fill="#0a55b4" opacity=".82" d="M235 230 C280 208 334 212 367 245 C332 268 281 283 233 273 C214 260 216 243 235 230Z"/></g></svg></div><div class="controls"><button class="btn active" data-state="neutral">Neutral</button><button class="btn" data-state="flap">Flap</button><button class="btn" data-state="glide">Glide</button><button class="btn" data-state="fall">Fall</button><button class="btn" data-state="boost">Boost</button></div><div class="notes"><span class="tag">لا أقدام</span><span class="tag">لا جناح منفصل</span><span class="tag">وجه لليمين</span><span class="tag">عين بيضاء بدون بؤبؤ</span><span class="tag">عصابة نينجا</span></div><a class="back" href="index.html">العودة للعبة</a></section></main><script>const hero=document.getElementById('hero'),wing=document.getElementById('wingMark');const states={neutral:{t:'translateY(0) rotate(0deg) scale(1)',w:'M235 230 C280 208 334 212 367 245 C332 268 281 283 233 273 C214 260 216 243 235 230Z'},flap:{t:'translateY(-14px) rotate(-5deg) scale(1)',w:'M220 248 C255 190 316 165 363 187 C340 234 300 270 244 286 C216 282 204 268 220 248Z'},glide:{t:'translateX(16px) translateY(-4px) rotate(3deg) scale(1)',w:'M220 244 C285 216 353 218 403 246 C352 265 292 276 232 273 C211 265 206 254 220 244Z'},fall:{t:'translateY(28px) rotate(13deg) scale(1)',w:'M236 239 C278 225 318 230 347 253 C315 269 278 277 243 273 C226 265 223 250 236 239Z'},boost:{t:'translateX(42px) rotate(-3deg) scale(1.04)',w:'M211 240 C288 201 374 205 430 241 C363 264 291 278 223 273 C199 263 196 250 211 240Z'}};function setState(s){document.querySelectorAll('.btn').forEach(b=>b.classList.toggle('active',b.dataset.state===s));hero.style.transform=states[s].t;wing.setAttribute('d',states[s].w);if(s==='flap'){hero.animate([{transform:'translateY(8px) rotate(2deg)'},{transform:'translateY(-16px) rotate(-6deg)'},{transform:'translateY(0) rotate(0)'}],{duration:420,iterations:1})}if(s==='boost'){hero.animate([{transform:'translateX(-16px) scale(.98)'},{transform:'translateX(54px) scale(1.06)'}],{duration:280,iterations:1,fill:'forwards'})}}document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>setState(b.dataset.state));</script></body></html>
