<!doctype html>
<html id="htmlTag" lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0f3e5b" />
  <title>Feather Fury — Lab</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&family=Press+Start+2P&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.3.6" />
  <link rel="stylesheet" href="lab-ui.css?v=1" />
  <link rel="stylesheet" href="ui-foundation-v1.css?v=1" />
  <link rel="stylesheet" href="ui-world-select-v1.css?v=7" />
  <link rel="stylesheet" href="ui-main-menu-v2.css?v=1" />
  <link rel="stylesheet" href="ui-main-menu-v3.css?v=4" />
  <link rel="stylesheet" href="ui-store-v1.css?v=2" />
  <link rel="stylesheet" href="ui-hud-v1.css?v=6" />
  <link rel="stylesheet" href="ui-runtime-fixes-v1.css?v=3" />
  <link rel="stylesheet" href="ui-end-screens-v1.css?v=2" />
  <link rel="stylesheet" href="ui-settings-leaderboard-v1.css?v=2" />
  <link rel="stylesheet" href="ui-splash-approved-v3.css?v=1" />
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="coin-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/><path d="M13 5 9 12h4l-2 7 5-9h-4l1-5Z" fill="#fff3b0"/></symbol>
    <symbol id="star-svg" viewBox="0 0 24 24"><path d="m12 2.5 2.85 5.78 6.38.93-4.62 4.5 1.09 6.35L12 17.06 6.3 20.06l1.09-6.35-4.62-4.5 6.38-.93L12 2.5Z" fill="currentColor"/></symbol>
    <symbol id="lang-svg" viewBox="0 0 24 24"><path d="M4 5h10M9 3v2m1.5 0c-.9 4-3 6.5-6 8m2.5-4c1.4 1.8 3 3.1 5 4m3-2h5m-2.5-2 3 8m-6 0 3-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="game-wrapper"><div id="app" class="game-container" data-ff-app-shell="1">
    <canvas id="gameCanvas" width="450" height="800" aria-label="Feather Fury Game"></canvas>

    <div id="startScreen" class="overlay-screen active">
      <div class="top-bar start-topbar">
        <div class="coin-pill start-balance"><svg width="22" height="22" viewBox="0 0 24 24"><use href="#coin-svg"></use></svg><span id="startTotalCoins">0</span></div>
        <div class="start-header-actions">
          <button id="leaderboardBtn" class="icon-btn" aria-label="Leaderboard">🏆</button>
          <button id="shopBtnStart" class="icon-btn" aria-label="Shop">🛒</button>
          <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
        </div>
      </div>
      <div class="start-main-content">
        <div class="title-container"><div class="game-title">FEATHER<br><span>FURY</span></div></div>
        <div class="world-select-shell">
          <button id="prevWorld" class="carousel-btn"><span>◀</span></button>
          <div id="worldCard" class="world-card">
            <div class="world-kicker" id="worldKicker">WORLD 1</div>
            <div class="world-title" id="worldTitle">Cursed Woods</div>
            <div class="preview-canvas-wrap"><canvas id="previewBirdCanvas" width="110" height="110"></canvas></div>
            <div class="world-meta"><div class="stars" id="worldStars">☆☆☆</div><div class="world-status" id="worldStatus">Ready</div></div>
          </div>
          <button id="nextWorld" class="carousel-btn"><span>▶</span></button>
          <div class="world-dots" id="worldDots"></div>
          <div class="start-actions-group">
            <button id="startStoryBtn" class="arcade-btn primary-btn">ابدأ</button>
            <button id="startEndlessBtn" class="arcade-btn secondary-btn">لا نهائي</button>
          </div>
        </div>
      </div>
    </div>

    <div id="settingsScreen" class="overlay-screen hidden"><div class="settings-dialog"><button id="closeSettingsBtn" class="close-btn">×</button><h2 class="dialog-title" data-i18n="settingsTitle">الإعدادات</h2><div class="settings-options"><div class="setting-row"><span data-i18n="langLabel">اللغة</span><button id="langToggleBtn" class="setting-action"></button></div><div class="setting-row"><span data-i18n="sfxLabel">المؤثرات الصوتية</span><button id="sfxToggleBtn" class="setting-action"></button></div><div class="setting-row"><span data-i18n="gfxLabel">الجودة</span><button id="gfxToggleBtn" class="setting-action"></button></div><div class="setting-row danger-row"><span data-i18n="resetLabel">حذف التقدم</span><button id="resetProgressBtn" class="setting-action danger-btn" data-i18n="resetBtn">حذف</button></div></div></div></div>

    <div id="shopScreen" class="overlay-screen hidden"><div class="shop-header"><button id="closeShopBtn" class="close-btn">×</button><h2 data-i18n="shopTitle">المتجر</h2><div class="shop-balance"><svg width="20" height="20" viewBox="0 0 24 24"><use href="#coin-svg"></use></svg><span id="shopTotalCoins">0</span></div></div><div id="shopItems" class="shop-grid"></div></div>

    <div id="leaderboardScreen" class="overlay-screen hidden"><div class="shop-header"><button id="closeLeaderboardBtn" class="close-btn">×</button><h2 data-i18n="leaderboardTitle">Leaderboard</h2></div><div class="leaderboard-content"><ol id="leaderboardList"></ol><p data-i18n="leaderboardSubtitle">Top local scores</p></div></div>

    <div id="gameHud" class="hud hidden"><div class="hud-top"><div class="hud-coin-badge"><svg width="22" height="22" viewBox="0 0 24 24"><use href="#coin-svg"></use></svg><span id="runCoins">0</span></div><div class="score-container"><span class="score-badge" id="scoreValue">0</span><span class="stage-badge" id="stageName">Forest Edge</span></div></div><div class="fever-bar-container"><span class="fever-label">FEVER</span><div class="fever-track"><div id="feverFill" class="fever-fill"></div></div></div><div id="ffBossHud" class="ff-boss-hud hidden"></div><div id="bossWarning" class="boss-warning hidden"></div></div>

    <div id="gameOverScreen" class="overlay-screen hidden"><div class="game-over-card"><h2 id="gameOverTitle">انتهت اللعبة</h2><div class="result-row"><span>Score</span><strong id="gameOverScore">0</strong></div><div class="result-row"><span>Coins</span><strong id="gameOverCoins">0</strong></div><div class="game-over-actions"><button id="restartBtn" class="arcade-btn primary-btn">إعادة</button><button id="reviveBtn" class="arcade-btn secondary-btn">إحياء</button><button id="shopBtnGameOver" class="arcade-btn secondary-btn">المتجر</button><button id="startEndlessBtnGameOver" class="arcade-btn secondary-btn">لا نهائي</button></div></div></div>

    <div id="ffToast" class="ff-toast" aria-live="polite"></div>

    <div id="ffCoreDomCompat" hidden aria-hidden="true">
      <span id="currentScoreDisplay">0</span><span id="sessionCoinDisplay">0</span><span id="stageDisplay">Forest Edge</span><span id="feverBarFill"></span>
      <span id="bossName">Boss</span><span id="bossHpText">100%</span><div id="bossHpFill"></div>
      <span id="gameOverScoreDisplay">0</span><span id="gameOverCoinsDisplay">0</span><span id="bestScoreDisplay">0</span>
      <span id="victoryScoreDisplay">0</span><span id="victoryCoinsDisplay">0</span><span id="victoryMessage"></span>
      <button id="resetDataBtn" type="button"></button><button id="startEndlessBtnGameOverCompat" type="button"></button>
    </div>
  </div></div>

  <script src="js/config.js?v=2.3.4"></script>
  <script src="js/audio.js?v=2.3.2"></script>
  <script src="js/graphics.js?v=2.3.2"></script>
  <script src="js/world1.js?v=2.3.2"></script>
  <script src="js/world2.js?v=2.3.2"></script>
  <script src="js/world3.js?v=2.3.2"></script>
  <script src="ui-splash-approved-v3.js?v=12"></script>
  <script src="game.js?v=2.4.7"></script>
  <script src="ui-runtime-boot-v1.js?v=7"></script>
</body>
</html>
