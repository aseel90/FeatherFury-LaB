<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#08111f">
  <title>Feather Fury</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=2.3.2">
  <link rel="stylesheet" href="ui-world-backgrounds.css?v=1">
  <link rel="stylesheet" href="lab-ui.css?v=1">
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="coin-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#fbbf24" stroke="#d97706" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="#f59e0b"/></symbol>
    <symbol id="sound-svg" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8c1.2 1 2 2.4 2 4s-.8 3-2 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="mute-svg" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l4 4m0-4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="lang-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9M12 3c-3 3-4 6-4 9s1 6 4 9" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  </svg>

  <div id="app">
    <section id="startScreen" class="screen active">
      <div class="start-shell">
        <h1 class="game-title">Feather Fury</h1>
        <div class="world-carousel">
          <button id="prevWorldBtn" class="carousel-arrow" aria-label="Previous world">‹</button>
          <div id="worldCard" class="world-card">
            <div class="world-card-art"><canvas id="previewBirdCanvas" width="180" height="150"></canvas></div>
            <div class="world-card-copy"><h2 id="worldName">Ancient Ruins</h2><div id="activeSkinName"></div></div>
          </div>
          <button id="nextWorldBtn" class="carousel-arrow" aria-label="Next world">›</button>
        </div>
        <div class="start-actions">
          <button id="startBtn" class="arcade-btn" data-i18n="startBtn">بداية المهمة</button>
          <button id="endlessBtn" class="arcade-btn secondary-btn" data-i18n="endlessBtn">الطور اللانهائي</button>
        </div>
        <div class="menu-shortcuts">
          <button id="shopBtnStart" class="icon-btn" aria-label="Shop">SHOP</button>
          <button id="leaderboardBtn" class="icon-btn" aria-label="Leaderboard">RANK</button>
          <button id="settingsBtn" class="icon-btn" aria-label="Settings">SET</button>
        </div>
        <div class="coin-total"><svg width="22" height="22"><use href="#coin-svg"></use></svg><span id="startTotalCoins">0</span></div>
      </div>
    </section>

    <section id="gameScreen" class="screen hidden">
      <canvas id="gameCanvas" width="360" height="640"></canvas>
      <div id="gameHud" class="hud hidden">
        <div class="hud-top">
          <div class="hud-coin-badge"><svg width="18" height="18"><use href="#coin-svg"></use></svg><span id="coinCount">0</span></div>
          <div class="score-container">
            <div id="scoreDisplay" class="score-badge">0</div>
            <div id="stageDisplay" class="stage-badge">Ruins</div>
          </div>
          <button id="soundToggleBtn" class="hud-sound-btn" aria-label="Sound"><svg width="22" height="22"><use href="#sound-svg"></use></svg></button>
        </div>
        <div class="fever-wrap"><span>FEVER</span><div class="fever-track"><div id="feverBarFill"></div></div></div>
      </div>

      <div id="bossWarning" class="boss-warning hidden">BOSS</div>
      <div id="dialogueBox" class="dialogue-box hidden"><div id="dialogueText"></div><div id="dialogueHint">Tap</div></div>
    </section>

    <section id="settingsScreen" class="screen hidden">
      <div class="settings-shell">
        <h2 data-i18n="settingsTitle">الإعدادات</h2>
        <div class="settings-panel">
          <div class="setting-row"><span data-i18n="languageLabel">اللغة</span><button id="langToggleBtn" class="setting-pill"></button></div>
          <div class="setting-row"><span data-i18n="sfxLabel">المؤثرات الصوتية</span><button id="sfxToggleBtn" class="setting-pill"></button></div>
          <div class="setting-row"><span data-i18n="gfxLabel">المؤثرات</span><button id="gfxToggleBtn" class="setting-pill"></button></div>
          <div class="setting-row danger"><span data-i18n="resetData">حذف البيانات</span><button id="resetDataBtn" class="danger-btn" data-i18n="confirm">تأكيد</button></div>
        </div>
        <div class="settings-meta"><div>Version 2.2.6</div><div>Developed by <strong>Aseel Salah</strong></div></div>
        <button id="closeSettingsBtn" class="arcade-btn return-btn" data-i18n="returnBtn">رجوع</button>
      </div>
    </section>

    <section id="shopScreen" class="screen hidden"><div class="shop-shell"><h2 data-i18n="shopTitle">متجر الأبطال</h2><div class="coin-total"><svg width="22" height="22"><use href="#coin-svg"></use></svg><span id="shopTotalCoins">0</span></div><div id="skinsGrid" class="skins-grid"></div><button id="closeShopBtn" class="arcade-btn return-btn" data-i18n="returnBtn">رجوع</button></div></section>
    <section id="leaderboardScreen" class="screen hidden"><div class="leaderboard-shell"><h2 data-i18n="leaderboardTitle">لوحة الصدارة</h2><ol id="leaderboardList"></ol><button id="closeLeaderboardBtn" class="arcade-btn return-btn" data-i18n="returnBtn">رجوع</button></div></section>

    <section id="gameOverScreen" class="screen hidden overlay-screen">
      <div class="gameover-card">
        <h2 id="gameOverTitle">Game Over</h2>
        <div id="gameOverScore"></div>
        <div class="gameover-actions">
          <button id="reviveBtn" class="arcade-btn revive-btn" data-i18n="reviveBtn">استمرار (محاولة ثانية)</button>
          <button id="restartBtn" class="arcade-btn" data-i18n="restartBtn">إعادة المحاولة</button>
          <button id="mainMenuBtn" class="arcade-btn secondary-btn" data-i18n="mainMenuBtn">القائمة الرئيسية</button>
        </div>
      </div>
    </section>

    <section id="victoryScreen" class="screen hidden overlay-screen"><div class="gameover-card"><h2 data-i18n="victoryTitle">Victory</h2><div id="victoryScore"></div><button id="nextWorldActionBtn" class="arcade-btn">Next</button></div></section>
  </div>

  <script src="js/config.js?v=2.3.2"></script>
  <script src="js/audio.js?v=2.3.2"></script>
  <script src="js/graphics.js?v=2.3.2"></script>
  <script src="js/world1.js?v=2.3.2"></script>
  <script src="js/world2.js?v=2.3.2"></script>
  <script src="js/world3.js?v=2.3.2"></script>
  <script src="game.js?v=2.3.6"></script>
  <script src="lab-ui.js?v=1"></script>
</body>
</html>
