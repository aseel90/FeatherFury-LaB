<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Feather Fury</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@600;800&family=Press+Start+2P&family=Tajawal:wght@700;900&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.3.3-lab">
  <link rel="stylesheet" href="lab-ui.css?v=2">
</head>
<body>
  <!-- SVG Definitions -->
  <svg style="display:none;">
    <defs>
      <symbol id="icon-trophy" viewBox="0 0 24 24">
        <path d="M8 4h8v3c0 3.31-1.79 6-4 6s-4-2.69-4-6V4z" fill="currentColor"/>
        <path d="M8 6H5v1c0 2.21 1.79 4 4 4M16 6h3v1c0 2.21-1.79 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M12 13v4M9 20h6M10 17h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <path d="M19.14 12.94a7.43 7.43 0 000-1.88l2.03-1.58-2-3.46-2.39.96a7.68 7.68 0 00-1.62-.94L14.8 3h-4l-.36 3.04c-.58.24-1.12.55-1.62.94l-2.39-.96-2 3.46 2.03 1.58a7.43 7.43 0 000 1.88L4.43 14.52l2 3.46 2.39-.96c.5.39 1.04.7 1.62.94L10.8 21h4l.36-3.04c.58-.24 1.12-.55 1.62-.94l2.39.96 2-3.46-2.03-1.58z" fill="currentColor"/>
        <circle cx="12" cy="12" r="3" fill="#0f172a"/>
      </symbol>
      <symbol id="icon-home" viewBox="0 0 24 24">
        <path d="M3 11.5L12 4l9 7.5v8a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-8z" fill="currentColor"/>
      </symbol>
      <symbol id="icon-volume" viewBox="0 0 24 24">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
        <path d="M16 8c1.5 1.5 1.5 6 0 8M18.5 5.5c3 3 3 10 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="game-wrapper">
    <div class="game-container">
      <canvas id="gameCanvas"></canvas>

      <div id="startScreen" class="overlay-screen active">
        <div class="top-bar">
          <div class="coin-pill">🪙 <span id="coinsDisplay">0</span></div>
          <div style="display:flex;gap:8px;align-items:center;">
            <button id="leaderboardBtn" class="icon-btn" aria-label="Leaderboard"><svg><use href="#icon-trophy"></use></svg></button>
            <button id="settingsBtn" class="icon-btn" aria-label="Settings"><svg><use href="#icon-settings"></use></svg></button>
            <button id="shopBtn" class="shop-trigger-btn" data-i18n="shopBtn">المتجر</button>
          </div>
        </div>

        <div class="start-main-content">
          <div class="title-container">
            <h1 class="game-title">FEATHER<br><span class="highlight">FURY</span></h1>
            <div class="game-subtitle">FeatherFury: Vengeance</div>
          </div>

          <div class="worlds-carousel">
            <button id="prevWorldBtn" class="carousel-nav-btn" aria-label="Previous World"></button>
            <div class="world-card" id="worldCard">
              <div class="world-title" id="worldTitle">الأطلال</div>
              <div class="world-stars" id="worldStars"></div>
              <div class="bird-preview">
                <div class="preview-canvas-wrap">
                  <canvas id="previewBirdCanvas" width="54" height="54"></canvas>
                </div>
                <span id="activeSkinName" class="skin-name-badge">العصفور الكلاسيكي</span>
              </div>
              <div class="world-status" id="worldStatus">جاهز للعب!</div>
            </div>
            <button id="nextWorldBtn" class="carousel-nav-btn" aria-label="Next World"></button>
          </div>

          <div class="start-actions-group">
            <button id="startStoryBtn" class="arcade-btn" data-i18n="startMission">ابدأ المهمة</button>
            <button id="endlessBtn" class="arcade-btn secondary-action-btn" data-i18n="endlessMode">الوضع اللانهائي</button>
          </div>
        </div>
      </div>

      <div id="settingsScreen" class="overlay-screen hidden">
        <div class="settings-panel">
          <h2 data-i18n="settingsTitle">الإعدادات</h2>
          <div class="settings-row">
            <span data-i18n="languageLabel">اللغة</span>
            <button id="languageToggle" class="small-btn">EN</button>
          </div>
          <div class="settings-row">
            <span data-i18n="soundLabel">الصوت</span>
            <button id="soundToggle" class="small-btn"><svg><use href="#icon-volume"></use></svg></button>
          </div>
          <button id="settingsBackBtn" class="arcade-btn" data-i18n="backBtn">رجوع</button>
        </div>
      </div>

      <div id="leaderboardScreen" class="overlay-screen hidden">
        <div class="leaderboard-panel">
          <h2 data-i18n="leaderboardTitle">لوحة الصدارة</h2>
          <div id="leaderboardList" class="leaderboard-list"></div>
          <button id="leaderboardBackBtn" class="arcade-btn" data-i18n="backBtn">رجوع</button>
        </div>
      </div>

      <div id="shopScreen" class="overlay-screen hidden">
        <div class="shop-header">
          <button id="shopBackBtn" class="icon-btn"><svg><use href="#icon-home"></use></svg></button>
          <h2 data-i18n="shopTitle">متجر الأبطال</h2>
          <div class="coin-pill">🪙 <span id="shopCoinsDisplay">0</span></div>
        </div>
        <div id="shopGrid" class="shop-grid"></div>
      </div>

      <div id="gameOverScreen" class="overlay-screen hidden">
        <div class="game-over-panel">
          <h2 id="gameOverTitle">انتهت اللعبة</h2>
          <div id="gameOverStats"></div>
          <div class="game-over-buttons-group">
            <button id="restartBtn" class="arcade-btn">إعادة المحاولة</button>
            <button id="homeBtn" class="arcade-btn secondary-action-btn">الرئيسية</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=2.3.2"></script>
  <script src="js/graphics.js?v=2.3.2"></script>
  <script src="js/audio.js?v=2.3.2"></script>
  <script src="js/world1.js?v=2.3.2"></script>
  <script src="js/world2.js?v=2.3.2"></script>
  <script src="js/world3.js?v=2.3.2"></script>
  <script src="game.js?v=2.3.2"></script>
  <script src="lab-ui.js?v=1"></script>
</body>
</html>
