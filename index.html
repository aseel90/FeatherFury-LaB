<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Feather Fury</title><link rel="stylesheet" href="style.css?v=2.3.17"><link rel="stylesheet" href="lab-ui.css?v=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet"></head><body><svg width="0" height="0" style="position:absolute"><defs><linearGradient id="coinGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><symbol id="coin-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="url(#coinGrad)" stroke="#fbbf24" stroke-width="1.5"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#fef3c7" stroke-width="1.2" opacity=".65"/><path d="M9.5 8.5h5v1.8h-3.2v1h2.8v1.7h-2.8v2.5H9.5z" fill="#92400e"/></symbol></defs></svg><div id="app"><div class="game-shell"><div class="game-container"><canvas id="gameCanvas" width="360" height="640"></canvas><div class="scanlines"></div><div class="game-title" data-i18n="title">Feather Fury</div><div class="top-bar"><div class="top-left"><button id="pauseBtn" class="icon-btn pause-btn" aria-label="إيقاف مؤقت"><span></span><span></span></button></div><div class="score-box"><span class="label" data-i18n="score">النقاط</span><span id="scoreValue">0</span></div><div class="coin-pill"><svg width="20" height="20" viewBox="0 0 24 24"><use href="#coin-svg"></use></svg><span id="totalCoins">0</span></div></div><div class="fever-bar-container"><div class="fever-bar-label" data-i18n="fever">حمّى</div><div class="fever-bar"><div id="feverBarFill" class="fever-bar-fill"></div></div></div><div id="boostHud" class="boost-hud hidden"><span data-i18n="boost">تعزيز</span><div class="boost-dots"><i></i><i></i><i>
