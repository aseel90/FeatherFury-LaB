<!DOCTYPE html><html id="htmlTag" lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Feather Fury: الانتقام</title><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="favicon.png"><meta name="theme-color" content="#0f172a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Press+Start+2P&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=2.3.6"><link rel="stylesheet" href="lab-ui.css?v=1"><link rel="stylesheet" href="ui-foundation-v1.css?v=1"><link rel="stylesheet" href="ui-world-select-v1.css?v=5"><link rel="stylesheet" href="ui-main-menu-v2.css?v=1"><link rel="stylesheet" href="ui-main-menu-v3.css?v=4"><link rel="stylesheet" href="ui-store-v1.css?v=2"><link rel="stylesheet" href="ui-hud-v1.css?v=5"><link rel="stylesheet" href="ui-end-screens-v1.css?v=2"><link rel="stylesheet" href="ui-settings-leaderboard-v1.css?v=1"><link rel="stylesheet" href="ui-splash-approved-v3.css?v=1"></head><body>
  <div id="app" class="app-shell">
    <main id="gameStage" class="game-stage">
      <canvas id="gameCanvas" width="390" height="844" aria-label="Feather Fury game"></canvas>
      <section id="startScreen" class="screen active">
        <div class="top-bar"><div class="coin-pill"><span id="startTotalCoins">0</span></div><button id="settingsBtn" class="icon-btn" aria-label="الإعدادات"></button></div>
        <div class="start-main-content"><div class="title-container"><img class="game-logo" src="assets/ui/loading-hq/feather-fury-logo.png" alt="Feather Fury"></div><div id="worldsCarousel" class="worlds-carousel"><button class="world-nav prev" aria-label="السابق">‹</button><article id="worldCard" class="world-card"><div class="world-card-header"><div class="world-label">WORLD 1</div><h2 id="worldTitle">Cursed Woods</h2></div><div class="bird-preview"><div class="preview-canvas-wrap"><canvas id="previewBirdCanvas" width="72" height="72"></canvas></div><div class="skin-name-badge" id="previewBirdName"></div></div><div id="starsDisplay" class="stars-display"></div><div id="worldStatus" class="world-status"></div></article><button class="world-nav next" aria-label="التالي">›</button></div><div id="worldDots" class="world-dots"></div><button id="startStoryBtn" class="primary-action">ابدأ المهمة</button></div>
        <button id="leaderboardBtn" hidden aria-hidden="true"></button><button id="shopBtnStart" hidden aria-hidden="true"></button>
      </section>
      <section id="gameHud" class="hud hidden"><div class="hud-top"><div class="hud-coin-badge"><span id="runCoins">0</span></div><div class="score-container"><span id="scoreValue" class="score-badge">0</span><span id="stageName" class="stage-badge"></span></div><button id="soundToggleBtn" class="icon-btn"></button></div><div class="fever-bar-container"><div id="feverFill" class="fever-fill"></div></div><div id="bossWarning" class="boss-warning hidden"></div><div id="gameHint" class="game-hint hidden"></div></section>
      <section id="gameOverScreen" class="screen hidden"><div class="gameover-panel"><p id="gameOverKicker"></p><h2 id="gameOverTitle"></h2><div id="resultStars"></div><div class="result-stats"><div><span id="resultScore">0</span><small>النقاط</small></div><div><span id="resultBest">0</span><small>أفضل نتيجة</small></div><div><span id="resultCoins">0</span><small>جمعت</small></div></div><button id="nextWorldBtn" class="hidden">العالم التالي</button><button id="reviveBtn" class="hidden">استمرار</button><div id="reviveAdSlot" class="hidden"></div><div class="gameover-actions"><button id="restartBtn">إعادة اللعب</button><button id="shopBtnGameOver">المتجر</button><button id="menuBtn">الرئيسية</button></div></div></section>
      <section id="settingsScreen" class="screen hidden"><div class="settings-panel"><button id="closeSettingsBtn">×</button><h2 id="settingsTitle">الإعدادات</h2><button id="languageBtn"></button><button id="soundBtn"></button><button id="particlesBtn"></button><button id="resetBtn"></button></div></section>
      <section id="shopScreen" class="screen hidden"><div id="shopContent"></div></section>
      <section id="leaderboardScreen" class="screen hidden"><div id="leaderboardContent"></div></section>
      <div id="gameToast" class="game-toast hidden"></div>
    </main>
  </div>
  <script src="config.js?v=1"></script><script src="audio.js?v=1"></script><script src="game.js?v=2.4.7"></script><script src="ui-runtime-boot-v1.js?v=4"></script><script src="ui-splash-approved-v3.js?v=11"></script>
</body></html>
