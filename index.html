<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#06101f">
  <title>Feather Fury</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&family=Press+Start+2P&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.3.4">
  <link rel="stylesheet" href="lab-ui.css?v=2">
  <link rel="stylesheet" href="ui-foundation-v1.css?v=1">
  <link rel="stylesheet" href="ui-world-select-v1.css?v=5">
  <link rel="stylesheet" href="ui-main-menu-v2.css?v=1">
  <link rel="stylesheet" href="ui-main-menu-v3.css?v=6">
  <link rel="stylesheet" href="ui-store-v1.css?v=2">
  <link rel="stylesheet" href="ui-hud-v1.css?v=2">
  <link rel="stylesheet" href="ui-end-screens-v1.css?v=2">
  <link rel="stylesheet" href="ui-settings-leaderboard-v1.css?v=1">
  <link rel="stylesheet" href="ui-splash-approved-v3.css?v=9">
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="360" height="640"></canvas>
    <div id="gameHud" class="game-hud hidden">
      <div class="hud-top-row"><div class="hud-stat coin-pill"><svg width="24" height="24" viewBox="0 0 24 24"><use href="#coin-svg"></use></svg><span id="coinDisplay">0</span></div><div class="hud-center"><div id="scoreDisplay">0</div><div id="stageDisplay"></div></div><button id="settingsBtn" class="icon-btn" aria-label="الإعدادات"><svg width="24" height="24" viewBox="0 0 24 24"><use href="#settings-svg"></use></svg></button></div>
      <div class="fever-bar-container"><div class="fever-bar-label"><span data-i18n="feverLabel">الحمى</span></div><div class="fever-bar-track"><div id="feverBarFill" class="fever-bar-fill"></div></div></div>
      <div id="abilityHud" class="ability-hud hidden"></div>
      <div id="bossWarning" class="boss-warning hidden"></div>
      <div id="gameHint" class="game-hint hidden"></div>
    </div>

    <div id="startScreen" class="overlay-screen active">
      <div class="menu-card">
        <div class="menu-logo"><img src="assets/ui/loading-hq/feather-fury-logo.png" alt="Feather Fury"></div>
        <div class="world-carousel" id="worldCarousel">
          <button id="worldPrevBtn" class="carousel-arrow carousel-prev" aria-label="العالم السابق"><img src="carousel-arrow.svg" alt=""></button>
          <div id="worldCard" class="world-card"><div class="bird-preview"><div class="preview-canvas-wrap"><canvas id="previewBirdCanvas" width="96" height="76"></canvas></div><div id="skinNameBadge" class="skin-name-badge"></div></div><div class="world-card-info"><div class="world-kicker"></div><h1 class="world-title"></h1><div class="world-stars"></div><div class="world-status"></div></div></div>
          <button id="worldNextBtn" class="carousel-arrow carousel-next" aria-label="العالم التالي"><img src="carousel-arrow.svg" alt=""></button>
        </div>
        <button id="startBtn" class="arcade-btn start-btn">ابدأ</button>
        <div class="menu-actions"><button id="shopBtnStart" class="arcade-btn secondary-btn">المتجر</button><button id="leaderboardBtn" class="arcade-btn secondary-btn">المتصدرون</button></div>
      </div>
    </div>

    <div id="gameOverScreen" class="overlay-screen hidden"><div class="game-over-card"><div id="endGameBadge"></div><h2 id="endGameTitle"></h2><div id="starsDisplay"></div><div class="end-stats"><div><span data-i18n="scoreLabel">النقاط</span><strong id="finalScore">0</strong></div><div><span data-i18n="bestScoreLabel">أعلى نتيجة</span><strong id="bestScore">0</strong></div><div><span data-i18n="coinsCollectedLabel">جمعت</span><strong><span id="finalCoins">0</span></strong></div></div><button id="nextWorldActionBtn" class="arcade-btn hidden"></button><button id="reviveBtn" class="arcade-btn revive-btn"><span data-i18n="reviveBtn">استمرار</span><span class="revive-price"><svg width="18" height="18" viewBox="0 0 24 24"><use href="#coin-svg"></use></svg> 1</span></button><div class="game-over-actions"><button id="restartBtn" class="arcade-btn" data-i18n="restartBtn">إعادة اللعب</button><button id="shopBtnGameOver" class="arcade-btn secondary-btn" data-i18n="shopBtn">المتجر</button><button id="mainMenuBtn" class="arcade-btn secondary-btn" data-i18n="mainMenuBtn">الرئيسية</button></div></div></div>

    <div id="settingsScreen" class="overlay-screen hidden"><div class="settings-card"><div class="settings-header"><h2 data-i18n="settingsTitle">الإعدادات</h2><button id="closeSettingsBtn" class="icon-btn" aria-label="إغلاق">×</button></div><div class="setting-row"><span data-i18n="languageLabel">اللغة</span><button id="langToggleBtn" class="arcade-btn small-btn"></button></div><div class="setting-row"><span data-i18n="soundLabel">الصوت</span><button id="soundToggleBtn" class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24"><use href="#sound-on-svg"></use></svg></button></div><div class="setting-row"><span data-i18n="gfxLabel">المؤثرات</span><button id="gfxToggleBtn" class="arcade-btn small-btn"></button></div><button id="resetProgressBtn" class="arcade-btn danger-btn" data-i18n="resetProgressBtn">حذف التقدم</button></div></div>

    <div id="leaderboardScreen" class="overlay-screen hidden"><div class="shop-header"><h2 data-i18n="leaderboardTitle">أفضل اللاعبين</h2><button id="closeLeaderboardBtn" class="icon-btn" aria-label="إغلاق">×</button></div><div class="leaderboard-content"><ul id="leaderboardList"></ul><div data-i18n="leaderboardSubtitle">النتائج المباشرة</div></div></div>
    <div id="shopScreen" class="overlay-screen hidden"><div class="shop-header"><h2 data-i18n="shopTitle">متجر الأبطال</h2><div class="coin-pill shop-balance"><svg width="20" height="20" viewBox="0 0 24 24"><use href="#coin-svg"></use></svg><span id="shopTotalCoins">0</span></div></div><div class="skins-grid" id="skinsGrid"></div><button id="closeShopBtn" class="arcade-btn return-btn" data-i18n="returnBtn">العودة للعبة</button></div>
  </div>

  <svg width="0" height="0" style="position:absolute;visibility:hidden" aria-hidden="true"><defs>
    <g id="coin-svg"><circle cx="12" cy="12" r="10" fill="#f1c40f" stroke="#d35400" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="#f39c12"/></g>
    <g id="star-svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="currentColor" stroke="#000" stroke-width="1" stroke-linejoin="round"/></g>
    <g id="settings-svg"><path fill="#fff" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></g>
    <g id="sound-on-svg"><path fill="#fff" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></g>
    <g id="sound-off-svg"><path fill="#fff" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></g>
  </defs></svg>

  <script src="js/config.js?v=2.3.4"></script>
  <script src="js/audio.js?v=2.3.2"></script>
  <script src="js/graphics.js?v=2.3.2"></script>
  <script src="js/world1.js?v=2.3.2"></script>
  <script src="js/world2.js?v=2.3.2"></script>
  <script src="js/world3.js?v=2.3.2"></script>
  <script src="ui-splash-approved-v3.js?v=10"></script>
  <script src="game.js?v=2.4.2"></script>
  <script src="lab-ui.js?v=4"></script>
  <script src="ui-settings-leaderboard-v1.js?v=2"></script>
  <script src="ui-store-v1.js?v=1"></script>
  <script src="ui-main-menu-v3.js?v=4"></script>
  <script src="ui-main-menu-v2.js?v=1"></script>
  <script src="ui-world-select-v1.js?v=7"></script>
  <script src="ui-end-screens-v1.js?v=1"></script>
  <script src="ui-hud-v1.js?v=2"></script>
  <script src="ui-foundation-v1.js?v=1"></script>
</body>
</html>
