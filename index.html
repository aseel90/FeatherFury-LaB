<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Feather Fury</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@600;800&family=Press+Start+2P&family=Tajawal:wght@700;900&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.3.3-lab">
  <link rel="stylesheet" href="lab-ui.css?v=3">
</head>
<body>
  <!-- SVG Definitions -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
  </svg>

  <div class="game-wrapper">
    <div class="game-container">
      <canvas id="gameCanvas"></canvas>

      <div id="startScreen" class="overlay-screen active">
        <div class="top-bar">
          <div class="coin-pill"><span>🪙</span><span id="coinDisplay">0</span></div>
          <div style="display:flex; gap:8px; align-items:center;">
            <button id="leaderboardBtn" class="icon-btn" aria-label="Leaderboard">🏆</button>
            <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙️</button>
            <button id="shopBtn" class="shop-trigger-btn" data-i18n="shop">المتجر</button>
          </div>
        </div>

        <div class="start-main-content">
          <div class="title-container">
            <h1 class="game-title">FEATHER<br><span class="highlight">FURY</span></h1>
            <div class="game-subtitle">FeatherFury: Vengeance</div>
          </div>

          <div class="worlds-carousel">
            <button id="prevWorldBtn" class="carousel-nav-btn" aria-label="Previous World"></button>
            <div class="world-card" id="worldCard">
              <div class="world-title" id="worldTitle">الأطلال</div>
              <div class="world-stars" id="worldStars">
                <span class="star empty">☆</span>
                <span class="star empty">☆</span>
                <span class="star empty">☆</span>
              </div>
              <div class="bird-preview">
                <div class="preview-canvas-wrap">
                  <canvas id="previewBirdCanvas" width="54" height="54"></canvas>
                </div>
                <span id="activeSkinName" class="skin-name-badge">العصفور الكلاسيكي</span>
              </div>
              <div class="world-status" id="worldStatus">جاهز للعب!</div>
            </div>
            <button id="nextWorldBtn" class="carousel-nav-btn" aria-label="Next World"></button>
          </div>

          <div class="start-actions-group">
            <button id="startStoryBtn" class="arcade-btn" data-i18n="startMission">ابدأ المهمة</button>
            <button id="endlessBtn" class="arcade-btn secondary-action-btn" data-i18n="endlessMode">الوضع اللانهائي</button>
          </div>
        </div>
      </div>

      <div id="settingsScreen" class="overlay-screen hidden">
        <div class="screen-panel settings-panel">
          <button id="settingsCloseBtn" class="close-x-btn">✕</button>
          <h2 data-i18n="settingsTitle">الإعدادات</h2>
          <div class="settings-row">
            <span data-i18n="soundLabel">الصوت</span>
            <button id="soundToggleBtn" class="toggle-btn">🔊</button>
          </div>
          <div class="settings-row">
            <span data-i18n="musicLabel">الموسيقى</span>
            <button id="musicToggleBtn" class="toggle-btn">🎵</button>
          </div>
          <div class="settings-row">
            <span data-i18n="languageLabel">اللغة</span>
            <button id="languageToggleBtn" class="toggle-btn">AR</button>
          </div>
          <div class="settings-row">
            <span data-i18n="vibrationLabel">الاهتزاز</span>
            <button id="vibrationToggleBtn" class="toggle-btn">📳</button>
          </div>
        </div>
      </div>

      <div id="leaderboardScreen" class="overlay-screen hidden">
        <div class="screen-panel leaderboard-panel">
          <button id="leaderboardCloseBtn" class="close-x-btn">✕</button>
          <h2 data-i18n="leaderboardTitle">لوحة الصدارة</h2>
          <div id="leaderboardList" class="leaderboard-list"></div>
        </div>
      </div>

      <div id="shopScreen" class="overlay-screen hidden">
        <div class="screen-panel shop-panel">
          <button id="shopCloseBtn" class="close-x-btn">✕</button>
          <h2 data-i18n="shopTitle">متجر الأبطال</h2>
          <div id="shopGrid" class="shop-grid"></div>
        </div>
      </div>

      <div id="pauseScreen" class="overlay-screen hidden">
        <div class="screen-panel pause-panel">
          <h2 data-i18n="paused">متوقف مؤقتًا</h2>
          <button id="resumeBtn" class="arcade-btn" data-i18n="resume">متابعة</button>
          <button id="quitBtn" class="arcade-btn secondary-action-btn" data-i18n="quit">خروج</button>
        </div>
      </div>

      <div id="gameOverScreen" class="overlay-screen hidden">
        <div class="screen-panel game-over-panel">
          <h2 id="gameOverTitle" data-i18n="gameOver">انتهت اللعبة</h2>
          <div id="gameOverStats"></div>
          <div class="game-over-buttons-group">
            <button id="restartBtn" class="arcade-btn" data-i18n="retry">إعادة المحاولة</button>
            <button id="homeBtn" class="arcade-btn secondary-action-btn" data-i18n="home">الرئيسية</button>
          </div>
        </div>
      </div>

      <div id="hud" class="hud hidden">
        <div class="hud-left">
          <span id="hudScore">0</span>
        </div>
        <button id="pauseBtn" class="hud-pause-btn">Ⅱ</button>
      </div>

      <div id="toast" class="toast"></div>
    </div>
  </div>

  <script src="js/config.js?v=2.3.2"></script>
  <script src="js/audio.js?v=2.3.2"></script>
  <script src="js/graphics.js?v=2.3.2"></script>
  <script src="js/world1.js?v=2.3.2"></script>
  <script src="js/world2.js?v=2.3.2"></script>
  <script src="js/world3.js?v=2.3.2"></script>
  <script src="game.js?v=2.3.2"></script>
  <script src="lab-ui.js?v=1"></script>
</body>
</html>
