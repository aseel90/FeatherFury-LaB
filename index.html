    <canvas id="gameCanvas"></canvas>

          <button id="langBtn" class="icon-btn" aria-label="Change Language"><svg width="24" height="24" viewBox="0 0 24 24"><use href="#lang-svg"></use></svg></button>
          <button id="settingsBtn" class="icon-btn" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24"><use href="#settings-svg"></use></svg></button>
        </div>
        <h1 id="gameTitle">Feather Hero</h1><p class="subtitle" data-i18n="subtitle">بطل الريش</p>
        <div id="heroPreview"><canvas id="previewBirdCanvas" width="100" height="80"></canvas><div id="activeSkinName">...</div></div>
        <div id="mainMenuStats"><div class="stat-item"><span class="stat-label" data-i18n="highScoreLabel">أفضل نتيجة</span><span id="highScoreDisplay" class="stat-value">0</span></div><div class="stat-item"><span class="stat-label" data-i18n="totalCoinsLabel">إجمالي العملات</span><span class="stat-value coin-value"><svg width="16" height="16" viewBox="0 0 24 24"><use href="#coin-svg"></use></svg><span id="totalCoinsDisplay">0</span></span></div></div>
        <button id="startBtn" class="arcade-btn primary-btn" data-i18n="startBtn">ابدأ المغامرة</button><button id="shopBtn" class="arcade-btn" data-i18n="shopBtn">متجر الأبطال</button><button id="leaderboardBtn" class="arcade-btn secondary-btn" data-i18n="leaderboardBtn">لوحة الصدارة</button>

      </div>
      <div id="gameHud" class="hidden"><div id="topBar"><div id="scoreContainer"><span id="scoreLabel" data-i18n="scoreLabel">النقاط</span><span id="currentScoreDisplay">0</span></div><div id="worldIndicator"><span id="worldLabel">العالم 1</span></div><div id="sessionCoinContainer"><svg width="18" height="18" viewBox="0 0 24 24"><use href="#coin-svg"></use></svg><span id="sessionCoinDisplay">0</span></div></div><div id="feverBarContainer"><div id="feverBarFill"></div></div></div>
