<!doctype html><html lang="ar" dir="rtl"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Feather Hero - غضب الريش</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=2.3.2">
</head><body><div class="app-shell"><div class="game-card">
  <div class="top-header"><button id="langToggle" class="lang-toggle">EN</button><h1 data-i18n="gameTitle">غضب الريش</h1><div id="totalCoins" class="coin-pill"><svg width="20" height="20" viewBox="0 0 24 24"><use href="#coin-svg"></use></svg><span>0</span></div></div>
  <div class="canvas-container" id="canvasWrap"><canvas id="gameCanvas" width="360" height="640"></canvas><div id="abilityButtonMount" aria-live="polite"></div></div>
  <div id="missionHud" class="mission-hud hidden"><div id="feverBarWrap" class="fever-bar-wrap"><span id="feverLabel">FEVER</span><div class="fever-track"><div id="feverFill"></div></div></div><div id="reviveBadge" class="revive-badge hidden"><span>REVIVE</span><span id="reviveCount">0</span></div></div>
  <div class="world-select"><div class="world-selector"><button id="prevWorldBtn" class="world-nav">‹</button><div class="world-info"><div id="worldName" class="world-name">Ruins</div><div id="worldLock" class="world-lock" data-i18n="worldUnlocked">جاهز للعب!</div></div><button id="nextWorldBtn" class="world-nav">›</button></div><button id="worldActionBtn" class="arcade-btn" data-i18n="startMission">بدء المهمة</button></div>
  <div class="menu-actions"><button id="shopBtn" class="arcade-btn" data-i18n="shopBtn">متجر الأبطال</button><button id="leaderboardBtn" class="arcade-btn" data-i18n="leaderboardBtn">لوحة الشرف</button></div>
  <div id="loadingScreen" class="loading-screen hidden">Loading…</div>
  <div id="gameOverScreen" class="overlay-screen hidden"><h2 id="gameOverTitle"></h2><div id="scoreLine"></div><div id="highScoreLine"></div><button id="reviveBtn" class="arcade-btn hidden"></button><button id="nextWorldActionBtn" class="arcade-btn hidden"></button><button id="mainMenuBtn" class="arcade-btn"></button></div>
  <div id="leaderboardScreen" class="overlay-screen hidden" style="background: rgba(15, 23, 42, 0.96); display: flex; flex-direction: column; align-items: center; justify-content: center;"><div class="shop-header" style="width: 100%; max-width: 350px;"><h2 data-i18n="leaderboardTitle">أفضل اللاعبين</h2><button id="closeLeaderboardBtn" class="arcade-btn" style="background: #e74c3c; font-size: 0.9rem; padding: 5px 15px; width: auto; margin: 0;">✕</button></div><div class="leaderboard-content" style="background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; margin-top: 20px; max-width: 350px; width: 90%;"><ul id="leaderboardList" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px;"></ul><div data-i18n="leaderboardSubtitle" style="margin-top: 15px; font-size: 0.8rem; color: #94a3b8; text-align: center;">النتائج المباشرة</div></div></div>
  <div id="shopScreen" class="overlay-screen hidden"><div class="shop-header"><h2 data-i18n="shopTitle">متجر الأبطال</h2><div class="coin-pill shop-balance"><svg width="20" height="20" viewBox="0 0 24 24"><use href="#coin-svg"></use></svg><span id="shopTotalCoins">0</span></div></div><div class="skins-grid" id="skinsGrid"></div><button id="closeShopBtn" class="arcade-btn return-btn" data-i18n="returnBtn">العودة للعبة</button></div>
  <svg width="0" height="0" style="position:absolute"><symbol id="coin-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f59e0b"/><circle cx="12" cy="12" r="7" fill="#fbbf24"/><circle cx="12" cy="12" r="4" fill="#f59e0b"/></symbol></svg>
</div></div>
<script src="js/config.js?v=2.3.4"></script><script src="js/audio.js?v=2.3.2"></script><script src="js/graphics.js?v=2.3.2"></script><script src="js/world1.js?v=2.3.2"></script><script src="js/world2.js?v=2.3.2"></script><script src="js/world3.js?v=2.3.2"></script><script src="game.js?v=2.3.48"></script><script src="lab-ui.js?v=1"></script>
</body></html>
