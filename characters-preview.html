<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feather Fury — Character Lab</title>
<style>
:root{--bg:#07111f;--panel:#0f1c2e;--line:#24344d;--text:#f8fafc;--muted:#94a3b8;--gold:#f8c44f;--blue:#2f80ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--text);background:radial-gradient(circle at 50% -10%,#183b6d 0,#0b1829 38%,#050b13 100%)}main{max-width:1180px;margin:auto;padding:30px 18px 50px}.hero{text-align:center;margin-bottom:24px}.logo{font-size:clamp(34px,7vw,66px);font-weight:1000;line-height:.85;letter-spacing:-3px;text-shadow:0 7px 0 #07111f}.logo span{display:block;color:var(--gold)}h1{margin:20px 0 6px;font-size:clamp(24px,4vw,38px)}.hero p{margin:0;color:#cbd5e1}.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 28px}.btn{border:1px solid #3a4c68;background:#142238;color:white;padding:11px 17px;border-radius:14px;font-weight:800;text-decoration:none;cursor:pointer}.btn.primary{background:linear-gradient(#ffd75f,#e9a91d);color:#191400;border-color:#ffe59a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{position:relative;background:linear-gradient(180deg,rgba(18,33,54,.96),rgba(10,20,35,.96));border:2px solid var(--line);border-radius:23px;padding:15px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#50698f}.card.selected{border-color:var(--gold);box-shadow:0 0 0 3px rgba(248,196,79,.12),0 18px 40px rgba(0,0,0,.25)}.tag{position:absolute;top:12px;left:12px;background:var(--gold);color:#241a00;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;display:none}.selected .tag{display:block}.preview{height:205px;border-radius:17px;background:radial-gradient(circle at 50% 30%,rgba(71,118,179,.25),rgba(4,10,18,.4));display:grid;place-items:center;border:1px solid rgba(255,255,255,.05)}.name{font-size:20px;font-weight:950;margin:14px 0 3px}.sub{font-size:13px;color:#7dd3fc;font-weight:800}.desc{font-size:14px;color:#b8c5d6;line-height:1.55;min-height:66px;margin:9px 0 14px}.choose{width:100%;border:0;border-radius:12px;padding:11px;background:#1e3350;color:#fff;font-weight:900;cursor:pointer}.selected .choose{background:var(--gold);color:#241a00}.note{margin-top:25px;border:1px dashed #34445d;border-radius:16px;padding:14px;color:#b8c5d6;text-align:center;font-size:14px}svg{width:min(165px,75%);filter:drop-shadow(0 14px 11px rgba(0,0,0,.3))}@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:24px 12px 35px}.grid{grid-template-columns:1fr}.preview{height:190px}}
</style>
</head>
<body><main>
<section class="hero"><div class="logo">FEATHER <span>FURY</span></div><h1>مختبر اختيار البطل</h1><p>هذه صفحة معاينة منفصلة فقط لنختار اتجاه الشخصية قبل تركيبها داخل اللعبة.</p></section>
<div class="bar"><a class="btn" href="index.html">العودة للعبة</a><button class="btn primary" id="confirm">اعتماد الشخصية المختارة</button></div>
<section class="grid" id="grid"></section>
<div class="note">التصاميم هنا نماذج مبسطة للمقارنة بين الاتجاهات. بعد اختيار واحد سنبني له الرسم النهائي وحركات Neutral / Flap / Glide بنفس الهوية.</div>
</main>
<script>
const birds=[
{id:'ninja',name:'Blue Ninja',sub:'الهوية الأساسية',body:'#2684ea',dark:'#0e4ea5',band:'#07152f',beak:'#f7b928',shape:'round',desc:'جسم أزرق بسيط، وجه متجه لليمين، عين بيضاء حادة، عصابة نينجا وأجنحة صغيرة.'},
{id:'swift',name:'Sky Swift',sub:'خفيف وسريع',body:'#42a5f5',dark:'#1769aa',band:'#10233f',beak:'#ffc43d',shape:'slim',desc:'جسم أنحف ومقدمة أكثر حدة. مناسب إذا أردنا إحساس سرعة وخفة أثناء الطيران.'},
{id:'brute',name:'Storm Brute',sub:'أقوى بصريًا',body:'#1f6fc4',dark:'#123e75',band:'#081528',beak:'#ffbe36',shape:'wide',desc:'جسم أعرض وكتف أوضح، مع نفس اتجاه النينجا. يعطي حضورًا أقوى بدون تعقيد كبير.'},
{id:'rook',name:'Rook Ninja',sub:'حاد ومشاكس',body:'#315b82',dark:'#172f49',band:'#050b12',beak:'#f4ad2c',shape:'angular',desc:'زوايا أكثر في الرأس والجسم، مع جناح صغير جدًا. شخصية أكثر شراسة وتميزًا في الظل.'},
{id:'frost',name:'Frost Wing',sub:'نظيف وبارد',body:'#77bdf2',dark:'#2d75aa',band:'#17314d',beak:'#ffd164',shape:'round',desc:'ألوان أفتح وملامح نظيفة. مناسب إذا أردنا بطلًا واضحًا جدًا أمام خلفيات المراحل الداكنة.'},
{id:'shadow',name:'Night Talon',sub:'نينجا داكن',body:'#234a77',dark:'#102b49',band:'#020914',beak:'#e9a925',shape:'slim',desc:'نسخة أغمق وأكثر نينجا، مع عين بيضاء بارزة جدًا وعصابة واضحة بدون تفاصيل زائدة.'}
];
function birdSVG(b){let rx=31,ry=25;if(b.shape==='slim'){rx=34;ry=21}else if(b.shape==='wide'){rx=35;ry=27}else if(b.shape==='angular'){return `<svg viewBox="0 0 150 120"><g stroke="#061222" stroke-width="4" stroke-linejoin="round"><path fill="${b.dark}" d="M38 73 17 61 24 78 13 87 42 88Z"/><path fill="${b.body}" d="M39 48 66 28 105 40 124 67 102 93 57 97 34 76Z"/><path fill="${b.body}" d="M55 36 47 17 66 29 73 10 83 31 94 17 95 38Z"/><path fill="${b.band}" d="M44 46 104 43 111 51 102 58 44 56Z"/><path fill="${b.band}" d="M46 49 28 38 35 54Z M44 54 25 62 39 66Z"/><path fill="white" d="M78 48 Q95 46 103 53 Q94 65 79 60 Q74 56 78 48Z"/><path fill="${b.beak}" d="M106 55 135 65 107 75Z"/><path fill="${b.dark}" d="M45 68 25 73 39 83 30 91 57 84Z"/></g></svg>`}return `<svg viewBox="0 0 150 120"><g stroke="#061222" stroke-width="4" stroke-linejoin="round"><path fill="${b.dark}" d="M41 74 17 61 25 77 15 86 43 89Z"/><ellipse fill="${b.body}" cx="75" cy="66" rx="${rx}" ry="${ry}"/><path fill="${b.body}" d="M55 43 48 20 65 32 74 12 82 32 94 20 94 45Z"/><path fill="${b.dark}" d="M49 69 Q31 65 28 77 Q39 85 56 81Z"/><path fill="${b.band}" d="M45 48 Q76 41 108 47 L111 55 Q78 54 45 58Z"/><path fill="${b.band}" d="M47 51 28 41 36 56Z M45 56 26 64 40 68Z"/><path fill="white" d="M78 49 Q95 47 104 54 Q95 66 80 61 Q75 57 78 49Z"/><path fill="${b.beak}" d="M106 57 136 66 107 76Z"/></g></svg>`}
let selected=localStorage.getItem('ff_character_preview')||'ninja';const grid=document.getElementById('grid');function render(){grid.innerHTML=birds.map(b=>`<article class="card ${b.id===selected?'selected':''}" data-id="${b.id}"><span class="tag">مختار</span><div class="preview">${birdSVG(b)}</div><div class="name">${b.name}</div><div class="sub">${b.sub}</div><div class="desc">${b.desc}</div><button class="choose">${b.id===selected?'تم الاختيار':'اختيار هذا الشكل'}</button></article>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{selected=c.dataset.id;localStorage.setItem('ff_character_preview',selected);render()})}render();document.getElementById('confirm').onclick=()=>{const b=birds.find(x=>x.id===selected);alert('تم حفظ اختيار المعاينة: '+b.name+'\nسنستخدمه كمرجع عند بناء النسخة النهائية داخل اللعبة.');};
</script></body></html>
