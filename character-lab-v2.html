<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feather Fury — Character Lab V2</title><style>:root{--bg:#050b13;--p:#0d1726;--line:#263954;--text:#f8fafc;--gold:#f9c94f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#1a4478 0,#0a1728 35%,#040911 74%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}button{font:inherit}main{max-width:1240px;margin:auto;padding:24px 16px 44px}.head{text-align:center;margin-bottom:18px}.logo{font-size:clamp(34px,7vw,66px);font-weight:1000;line-height:.8;letter-spacing:-3px;text-shadow:0 8px 0 #03070d}.logo span{display:block;color:var(--gold)}h1{font-size:clamp(24px,4vw,36px);margin:20px 0 7px}.head p{margin:0;color:#cbd5e1}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}.side,.panel{background:linear-gradient(180deg,rgba(17,31,51,.97),rgba(8,17,29,.98));border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 60px rgba(0,0,0,.25)}.side{padding:14px;display:grid;gap:12px}.card{display:grid;grid-template-columns:104px 1fr;gap:11px;align-items:center;padding:10px;background:#0a1524;border:2px solid #21344d;border-radius:17px;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#456384}.card.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(249,201,79,.12)}.thumb{height:90px;border-radius:13px;background:radial-gradient(circle at 50% 35%,rgba(71,129,196,.25),rgba(5,10,18,.35));display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}.cname{font-size:17px;font-weight:950}.car{font-size:13px;color:#7dd3fc;font-weight:900;margin-top:2px}.ctag{font-size:12px;color:#cbd5e1;margin-top:5px;line-height:1.4}.panel{padding:16px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.title h2{font-size:26px;margin:0 0 3px}.title .sub{color:#7dd3fc;font-weight:850}.mode{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid #385170;background:#10213a;color:#fff;padding:8px 11px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer}.pill.active{background:var(--gold);border-color:#ffe599;color:#241b00}.stage{position:relative;height:370px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.07);background:linear-gradient(#17365e 0%,#102743 45%,#071421 100%)}.stage:after{content:"";position:absolute;left:50%;bottom:48px;width:145px;height:18px;transform:translateX(-50%);background:rgba(0,0,0,.34);filter:blur(7px);border-radius:50%}.cloud{position:absolute;width:110px;height:26px;border-radius:999px;background:rgba(255,255,255,.07)}.c1{top:60px;left:7%;animation:cloud 7s linear infinite}.c2{top:120px;right:10%;width:150px;animation:cloud 9s linear infinite reverse}@keyframes cloud{from{transform:translateX(-18px)}to{transform:translateX(18px)}}.wrap{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none}.bird{width:min(48vw,285px);filter:drop-shadow(0 18px 12px rgba(0,0,0,.34));overflow:visible;transform-origin:50% 55%}.png{width:min(48vw,300px);max-height:270px;object-fit:contain;filter:drop-shadow(0 18px 12px rgba(0,0,0,.34));display:none}.speed,.aura,.hit{opacity:0;transition:opacity .16s}.tail,.wing,.body,.crest{transform-box:fill-box;transform-origin:center}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}.state{border:1px solid #344c6a;background:#0f2138;color:#dbeafe;border-radius:11px;padding:8px 10px;font-weight:800;cursor:pointer}.state.active{background:#e7b93e;color:#241a00;border-color:#ffe099}.auto{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}.autoBtn{border:1px solid #44617f;background:#17304f;color:#fff;padding:9px 13px;border-radius:12px;font-weight:900;cursor:pointer}.autoBtn.on{background:#0f766e;border-color:#2dd4bf}.desc{color:#b9c6d8;font-size:14px;line-height:1.7;margin:10px 0 0}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.facts>div{background:#0a1524;border:1px solid #233852;border-radius:12px;padding:9px}.facts b{display:block;font-size:12px;color:#8ba3bf;margin-bottom:4px}.facts span{font-size:13px;font-weight:800}.choice{display:flex;gap:9px;margin-top:14px}.choice a,.choice button{flex:1;text-align:center;text-decoration:none;border-radius:13px;padding:11px 14px;font-weight:950;cursor:pointer}.back{background:#14253c;color:white;border:1px solid #334b69}.select{background:linear-gradient(#ffd864,#e6a91e);color:#251a00;border:1px solid #ffe7a5}.status{margin-top:11px;text-align:center;color:#a7f3d0;font-weight:800;min-height:20px}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes flap{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(34deg)}}@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}@keyframes hurt{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-7px) rotate(-8deg)}70%{transform:translateX(5px) rotate(7deg)}}@keyframes fever{0%,100%{filter:drop-shadow(0 0 7px #38bdf8)}50%{filter:drop-shadow(0 0 19px #67e8f9)}}.s-hover .body{animation:bob 1s ease-in-out infinite}.s-hover .wing{transform:rotate(-5deg)}.s-flap .body{animation:bob .48s ease-in-out infinite}.s-flap .wing{animation:flap .42s ease-in-out infinite}.s-flap .tail{animation:tail .45s ease-in-out infinite}.s-glide .body{transform:rotate(4deg) translateY(2px)}.s-glide .wing{transform:rotate(-18deg) scaleX(1.16)}.s-glide .tail{transform:rotate(-9deg)}.s-fall .body{transform:translateY(24px) rotate(18deg)}.s-fall .wing{transform:rotate(28deg)}.s-dive .body{transform:translate(12px,26px) rotate(29deg)}.s-dive .wing{transform:rotate(45deg) scale(.85)}.s-dive .speed{opacity:.55}.s-boost .body{transform:translateX(26px) rotate(-5deg)}.s-boost .wing{transform:rotate(48deg) scale(.78)}.s-boost .speed{opacity:1}.s-boost .tail{transform:scaleX(1.28) rotate(-12deg)}.s-hurt .body{animation:hurt .36s ease-in-out infinite}.s-hurt .wing{transform:rotate(55deg)}.s-hurt .hit{opacity:1}.s-fever .body{transform:translateX(15px);animation:fever .55s ease-in-out infinite}.s-fever .wing{animation:flap .28s ease-in-out infinite}.s-fever .speed,.s-fever .aura{opacity:1}.s-fever .tail{animation:tail .25s ease-in-out infinite}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(3,1fr)}.card{grid-template-columns:1fr}.thumb{height:120px}.ctag{display:none}.facts{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){main{padding:18px 10px 32px}.side{grid-template-columns:1fr}.card{grid-template-columns:94px 1fr}.thumb{height:82px}.ctag{display:block}.stage{height:315px}.bird,.png{width:260px}.facts{grid-template-columns:1fr 1fr}}</style></head><body><main><section class="head"><div class="logo">FEATHER <span>FURY</span></div><h1>مختبر الشخصية — V2</h1><p>هذه المرة قيّم الشخصية وهي تتحرك، وليس من صورة ثابتة فقط.</p></section><div class="layout"><aside class="side" id="cards"></aside><section class="panel"><div class="top"><div class="title"><h2 id="name"></h2><div class="sub" id="ar"></div></div><div class="mode"><button class="pill active" id="svgBtn">SVG متحرك</button><button class="pill" id="pngBtn">PNG مرجع</button></div></div><div class="stage s-hover" id="stage"><div class="cloud c1"></div><div class="cloud c2"></div><div class="wrap"><div id="svgHost"></div><img id="pngHost" class="png"></div></div><div class="controls" id="controls"></div><div class="auto"><button class="autoBtn on" id="auto">▶ العرض التلقائي: يعمل</button><div style="color:#9fb1c8;font-size:13px">تحويم ← رفرفة ← انزلاق ← سقوط ← هبوط سريع ← تسارع ← إصابة ← حمّى</div></div><p class="desc" id="desc"></p><div class="facts"><div><b>اتجاه الوجه</b><span>يمين دائمًا</span></div><div><b>العين</b><span>بيضاء بلا بؤبؤ</span></div><div><b>العصابة</b><span>نينجا لا تغطي العين</span></div><div><b>الحجم</b><span>ثابت بين الحالات</span></div></div><div class="choice"><a class="back" href="index.html">العودة للعبة</a><button class="select" id="select">اختيار هذا التصميم</button></div><div class="status" id="status"></div></section></div></main><script>const C=[{id:'razor',name:'Razorwing',ar:'شفرة الريح',tag:'الأخف والأسرع',b1:'#2f8cff',b2:'#0d55bb',b3:'#073575',band:'#071529',beak:'#ffc342',acc:'#7dd3fc',shape:'sleek',desc:'جسم انسيابي طويل قليلًا، خصلة خلفية حادة، جناح صغير جدًا وعصابة نينجا ضيقة. مصمم ليبدو سريعًا من دون أن يتغير حجمه أثناء الحركة.'},{id:'kumo',name:'Kumo',ar:'كومو',tag:'الأوضح والأبسط',b1:'#3b9cff',b2:'#1768c9',b3:'#0a407f',band:'#0a1630',beak:'#ffbd3b',acc:'#a5f3fc',shape:'compact',desc:'أبسط شكل في المجموعة: جسم مضغوط، رأس واضح وعين حادة كبيرة نسبيًا. الأجنحة قصيرة وتتحرك حول محور ثابت لتقليل الاهتزاز البصري.'},{id:'storm',name:'Stormclaw',ar:'مخلب العاصفة',tag:'الأقوى حضورًا',b1:'#247bd8',b2:'#124d96',b3:'#082c59',band:'#050b16',beak:'#f7b52d',acc:'#67e8f9',shape:'strong',desc:'صدر أعرض وزوايا أكثر في الظهر والذيل، لكن الجناح يبقى صغيرًا. يعطي حضورًا أقوى في الشاشة مع الحفاظ على اتجاه الوجه لليمين والعين البيضاء الواحدة.'}];const S=[['hover','تحويم'],['flap','رفرفة'],['glide','انزلاق'],['fall','سقوط'],['dive','هبوط سريع'],['boost','تسارع'],['hurt','إصابة'],['fever','حمّى']];let active=localStorage.getItem('ff_character_lab_v2')||'kumo',state='hover',autoOn=true,timer,png=false,cache={};function paths(c){if(c.shape==='sleek')return{body:'M34 74 C38 43 62 29 101 38 C119 42 130 54 132 67 C127 83 111 94 81 96 C57 97 40 89 34 74 Z',crest:'M51 39 L43 20 L60 31 L72 10 L78 34 L95 19 L91 42 Z',wing:'M58 68 C44 58 29 61 24 72 C34 80 45 84 62 80 Z',tail:'M39 76 L17 64 L24 78 L12 88 L41 88 Z'};if(c.shape==='strong')return{body:'M35 76 L40 51 C47 34 65 27 94 31 L120 43 L134 62 L127 82 L104 96 L67 100 L43 91 Z',crest:'M51 41 L43 21 L60 30 L70 9 L78 33 L92 15 L95 40 Z',wing:'M56 67 L30 62 L22 74 L41 84 L62 78 Z',tail:'M39 78 L16 65 L25 79 L12 91 L43 90 Z'};return{body:'M38 75 C38 48 57 32 88 32 C113 32 130 47 132 68 C132 88 113 99 84 99 C58 99 41 91 38 75 Z',crest:'M57 37 L51 18 L65 29 L76 11 L82 33 L98 19 L94 39 Z',wing:'M57 69 C45 61 31 64 28 75 C37 83 47 85 61 81 Z',tail:'M41 78 L20 69 L25 81 L15 90 L43 90 Z'}}function svg(c,cls='bird'){let p=paths(c);return `<svg class="${cls}" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="b${c.id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${c.b1}"/><stop offset=".62" stop-color="${c.b2}"/><stop offset="1" stop-color="${c.b3}"/></linearGradient><linearGradient id="w${c.id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${c.b2}"/><stop offset="1" stop-color="${c.b3}"/></linearGradient><radialGradient id="a${c.id}"><stop stop-color="${c.acc}" stop-opacity=".65"/><stop offset="1" stop-color="${c.acc}" stop-opacity="0"/></radialGradient></defs><g class="aura"><ellipse cx="83" cy="66" rx="66" ry="47" fill="url(#a${c.id})"/><path d="M18 32 8 42 22 43 12 56 M24 85 10 92 27 97 M126 24 142 18 134 33 151 35" fill="none" stroke="${c.acc}" stroke-width="3"/></g><g class="speed" fill="none" stroke="${c.acc}" stroke-width="3" stroke-linecap="round"><path d="M6 45 H34 M1 58 H27 M8 72 H35 M12 86 H40"/></g><g class="body" stroke="#04101f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="${p.tail}" fill="url(#w${c.id})"/><path d="${p.body}" fill="url(#b${c.id})"/><path class="crest" d="${p.crest}" fill="url(#b${c.id})"/><g class="wing"><path d="${p.wing}" fill="url(#w${c.id})"/><path d="M34 73 Q42 75 51 76" fill="none" stroke="${c.acc}" stroke-width="2" opacity=".5"/></g><path d="M43 48 C66 42 101 42 118 48 L117 57 C93 53 67 53 43 58 Z" fill="${c.band}"/><g class="tail"><path d="M45 50 L27 40 L35 56 Z" fill="${c.band}"/><path d="M44 55 L25 64 L39 69 Z" fill="${c.band}"/></g><path d="M82 49 C94 47 106 50 112 56 C104 67 92 69 82 62 C78 58 78 53 82 49 Z" fill="#fff"/><path d="M116 58 L147 67 L117 77 Z" fill="${c.beak}"/><path d="M48 92 L47 104 L39 108 M71 96 L72 106 L79 109" fill="none" stroke="${c.beak}" stroke-width="4"/></g><g class="hit" stroke="#ffd95c" stroke-width="4" stroke-linecap="round"><path d="M117 26 125 13 M129 31 145 25 M120 38 138 43"/></g></svg>`}function pngData(c){return new Promise(res=>{if(cache[c.id])return res(cache[c.id]);let raw=svg(c,'').replace('<svg class=""','<svg width="480" height="360"');let blob=new Blob([raw],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),im=new Image();im.onload=()=>{let cv=document.createElement('canvas');cv.width=480;cv.height=360;let x=cv.getContext('2d');x.clearRect(0,0,480,360);x.drawImage(im,0,0,480,360);URL.revokeObjectURL(url);cache[c.id]=cv.toDataURL('image/png');res(cache[c.id])};im.src=url})}function cards(){let b=document.getElementById('cards');b.innerHTML=C.map(c=>`<div class="card ${c.id===active?'active':''}" data-id="${c.id}"><div class="thumb"><img id="t_${c.id}"></div><div><div class="cname">${c.name}</div><div class="car">${c.ar}</div><div class="ctag">${c.tag}</div></div></div>`).join('');b.querySelectorAll('.card').forEach(e=>e.onclick=()=>{active=e.dataset.id;state='hover';render();restart()});C.forEach(c=>pngData(c).then(d=>{let im=document.getElementById('t_'+c.id);if(im)im.src=d}))}function controls(){let b=document.getElementById('controls');b.innerHTML=S.map(([id,l])=>`<button class="state ${id===state?'active':''}" data-s="${id}">${l}</button>`).join('');b.querySelectorAll('.state').forEach(e=>e.onclick=()=>{state=e.dataset.s;autoOn=false;sync();stage();controls()})}function stage(){let c=C.find(x=>x.id===active)||C[0],st=document.getElementById('stage'),n=document.getElementById('name'),a=document.getElementById('ar'),d=document.getElementById('desc'),sh=document.getElementById('svgHost'),ph=document.getElementById('pngHost');st.className='stage s-'+state;n.textContent=c.name;a.textContent=c.ar+' — '+c.tag;d.textContent=c.desc;sh.innerHTML=svg(c);sh.style.display=png?'none':'block';ph.style.display=png?'block':'none';if(png)pngData(c).then(x=>ph.src=x)}function render(){cards();controls();stage()}function next(){let i=S.findIndex(x=>x[0]===state);state=S[(i+1)%S.length][0];controls();stage()}function restart(){clearInterval(timer);if(autoOn)timer=setInterval(next,1150)}function sync(){let b=document.getElementById('auto');b.textContent=autoOn?'▶ العرض التلقائي: يعمل':'⏸ العرض التلقائي: متوقف';b.classList.toggle('on',autoOn);restart()}document.getElementById('auto').onclick=()=>{autoOn=!autoOn;sync()};document.getElementById('svgBtn').onclick=()=>{png=false;svgBtn.classList.add('active');pngBtn.classList.remove('active');stage()};document.getElementById('pngBtn').onclick=()=>{png=true;pngBtn.classList.add('active');svgBtn.classList.remove('active');stage()};document.getElementById('select').onclick=()=>{let c=C.find(x=>x.id===active);localStorage.setItem('ff_character_lab_v2',active);document.getElementById('status').textContent='✓ تم حفظ اختيارك: '+c.name+' — '+c.ar};render();sync();</script></body></html>
