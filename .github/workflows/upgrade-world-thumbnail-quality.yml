name: Upgrade World Thumbnail Quality

on:
  push:
    paths:
      - '.github/workflows/upgrade-world-thumbnail-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upscale and sharpen world thumbnails
        shell: bash
        run: |
          set -e
          for f in assets/ui/world-thumbnails/world-*.webp; do
            tmp="${f%.webp}.hq.webp"
            ffmpeg -y -loglevel error -i "$f" \
              -vf "scale=720:480:flags=lanczos,unsharp=5:5:0.55:5:5:0" \
              -c:v libwebp -quality 88 "$tmp"
            mv "$tmp" "$f"
          done
      - name: Commit upgraded thumbnails
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/world-thumbnails
          git diff --cached --quiet && exit 0
          git commit -m 'Improve world thumbnail display quality'
          git push
