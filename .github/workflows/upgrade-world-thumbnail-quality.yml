name: Upgrade World Thumbnail Quality

on:
  push:
    paths:
      - '.github/workflows/upgrade-world-thumbnail-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick webp
      - name: Upscale and sharpen world thumbnails
        shell: bash
        run: |
          set -e
          for f in assets/ui/world-thumbnails/world-*.webp; do
            tmp="${f%.webp}.hq.webp"
            convert "$f" -filter Lanczos -resize 720x480! -unsharp 0x0.75+0.65+0.02 -quality 88 "$tmp"
            mv "$tmp" "$f"
          done
      - name: Commit upgraded thumbnails
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/world-thumbnails
          git diff --cached --quiet && exit 0
          git commit -m 'Improve world thumbnail display quality'
          git push
