name: Store card containment update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/store-card-containment-update.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply store layout update in owning files
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('ui-store-v1.css')
          index_path = Path('index.html')
          smoke_path = Path('scripts/live-smoke.mjs')
          integrity_path = Path('scripts/runtime-integrity-check.js')

          css = css_path.read_text()
          index = index_path.read_text()
          smoke = smoke_path.read_text()
          integrity = integrity_path.read_text()

          old = ".ff-store-items{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:2px 2px 12px;scrollbar-width:none}.ff-store-items::-webkit-scrollbar{display:none}.ff-store-item-card{position:relative;min-height:205px;padding:12px 9px 10px;border-radius:19px;border:1px solid rgba(82,137,193,.36);background:linear-gradient(180deg,rgba(16,37,69,.92),rgba(5,16,34,.95));display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:0 10px 22px rgba(0,0,0,.24)}"
          new = ".ff-store-items{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;align-items:start;gap:10px;padding:2px 2px 12px;scrollbar-width:none}.ff-store-items::-webkit-scrollbar{display:none}.ff-store-item-card{position:relative;box-sizing:border-box;width:100%;height:auto!important;min-height:205px;padding:12px 9px 10px;border-radius:19px;border:1px solid rgba(82,137,193,.36);background:linear-gradient(180deg,rgba(16,37,69,.92),rgba(5,16,34,.95));display:flex;flex-direction:column;align-items:center;gap:7px;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.24)}"
          if old not in css:
              raise SystemExit('Expected store grid/card block not found')
          css = css.replace(old, new, 1)

          old = ".ff-store-buy{margin-top:auto;width:100%;min-height:39px;border:1px solid #8feaff;border-radius:13px;background:linear-gradient(180deg,#22bfea,#0878ba);color:#fff;font:900 .9rem/1 'Tajawal',sans-serif;box-shadow:0 3px 0 #07527f;cursor:pointer}"
          new = ".ff-store-buy{flex:0 0 44px;align-self:stretch;box-sizing:border-box;margin-top:auto;width:100%;height:44px;min-height:44px!important;max-height:44px;padding:0 8px;border:1px solid #8feaff;border-radius:13px;background:linear-gradient(180deg,#22bfea,#0878ba);color:#fff;font:900 .9rem/1 'Tajawal',sans-serif;box-shadow:0 3px 0 #07527f;cursor:pointer}"
          if old not in css:
              raise SystemExit('Expected Buy button block not found')
          css = css.replace(old, new, 1)

          css = css.replace('.ff-store-item-card{min-width:0;min-height:clamp(174px,27dvh,210px);', '.ff-store-item-card{min-width:0;min-height:clamp(196px,27dvh,216px);', 1)
          css = css.replace('.ff-store-buy{min-height:clamp(38px,5.5dvh,42px)}', '.ff-store-buy{min-height:44px!important}', 1)
          css = css.replace('.ff-store-item-card{min-height:170px;padding-inline:6px;border-radius:16px}', '.ff-store-item-card{min-height:196px;padding-inline:6px;border-radius:16px}', 1)
          css = css.replace('.ff-store-item-card{min-height:166px}', '.ff-store-item-card{min-height:200px}', 1)
          css = css.replace('.ff-store-item-card{min-height:164px}', '.ff-store-item-card{min-height:190px}', 1)
          css = css.replace('.ff-store-item-card{min-height:146px;padding:7px 6px 7px;gap:4px}', '.ff-store-item-card{min-height:172px;padding:7px 6px 7px;gap:4px}', 1)
          css = css.replace('.ff-store-buy{min-height:32px;font-size:.75rem}', '.ff-store-buy{height:44px;min-height:44px!important;max-height:44px;font-size:.75rem}', 1)

          if 'ui-store-v1.css?v=2' not in index:
              raise SystemExit('Expected store CSS v2 cache key not found')
          index = index.replace('ui-store-v1.css?v=2', 'ui-store-v1.css?v=3', 1)

          needle = """  if (menu.storeBalanceStyle?.display !== 'flex' || !/Press Start 2P/i.test(menu.storeBalanceStyle?.fontFamily || '')) {\n    throw new Error(`Store coin balance identity is incomplete: ${JSON.stringify(menu.storeBalanceStyle)}`);\n  }\n\n  // Menu geometry/enabled state was already verified above. Use a DOM click here to avoid\n"""
          insert = """  if (menu.storeBalanceStyle?.display !== 'flex' || !/Press Start 2P/i.test(menu.storeBalanceStyle?.fontFamily || '')) {\n    throw new Error(`Store coin balance identity is incomplete: ${JSON.stringify(menu.storeBalanceStyle)}`);\n  }\n\n  // Store containment contract: on short mobile Safari-like heights every Buy button must\n  // remain fully inside its own character card.\n  await page.setViewportSize({ width: 390, height: 667 });\n  await page.evaluate(() => window.FFStoreUI?.open?.('shop'));\n  await page.waitForFunction(() => {\n    const screen = document.getElementById('shopScreen');\n    return screen?.classList.contains('active') && !screen.classList.contains('hidden') &&\n      document.querySelectorAll('.ff-store-item-card .ff-store-buy').length > 0;\n  }, null, { timeout: 5_000 });\n  const storeContainment = await page.evaluate(() => [...document.querySelectorAll('.ff-store-item-card')].map(card => {\n    const button = card.querySelector('.ff-store-buy');\n    const c = card.getBoundingClientRect();\n    const b = button?.getBoundingClientRect();\n    return {\n      card: { left:c.left, top:c.top, right:c.right, bottom:c.bottom, width:c.width, height:c.height },\n      button: b ? { left:b.left, top:b.top, right:b.right, bottom:b.bottom, width:b.width, height:b.height } : null,\n      contained: !!b && b.left >= c.left - 1 && b.right <= c.right + 1 && b.top >= c.top - 1 && b.bottom <= c.bottom + 1\n    };\n  }));\n  if (!storeContainment.length || storeContainment.some(x => !x.contained)) {\n    throw new Error(`Store Buy button escaped its card: ${JSON.stringify(storeContainment)}`);\n  }\n  await page.locator('#closeShopBtn').click({ timeout: 5_000 });\n  await page.waitForFunction(() => document.getElementById('startScreen')?.classList.contains('active') && document.getElementById('shopScreen')?.classList.contains('hidden'), null, { timeout: 5_000 });\n  await page.setViewportSize({ width: 390, height: 844 });\n  await page.waitForTimeout(80);\n\n  // Menu geometry/enabled state was already verified above. Use a DOM click here to avoid\n"""
          if needle not in smoke:
              raise SystemExit('Smoke test insertion point not found')
          smoke = smoke.replace(needle, insert, 1)

          anchor = "if (!/ff-store-balance[\\s\\S]*display:flex\\s*!important/i.test(runtimeFixCss)) fail('runtime fixes must normalize store coin balance');\n"
          addition = anchor + "if (!index.includes('ui-store-v1.css?v=3')) fail('index must load store CSS v3 containment release');\nconst storeCss = read('ui-store-v1.css');\nif (!/ff-store-items[^}]*grid-auto-rows:max-content/i.test(storeCss)) fail('store grid rows must expand to card content');\nif (!/ff-store-item-card[^}]*height:auto!important[^}]*overflow:hidden/i.test(storeCss)) fail('store cards must own their height and contain actions');\nif (!/ff-store-buy[^}]*height:44px[^}]*min-height:44px!important/i.test(storeCss)) fail('store Buy action must stay a fixed in-card touch target');\n"
          if anchor not in integrity:
              raise SystemExit('Integrity insertion point not found')
          integrity = integrity.replace(anchor, addition, 1)

          css_path.write_text(css)
          index_path.write_text(index)
          smoke_path.write_text(smoke)
          integrity_path.write_text(integrity)

      - name: Validate JavaScript and runtime contracts
        run: |
          node --check scripts/live-smoke.mjs
          node --check scripts/runtime-integrity-check.js
          node scripts/runtime-integrity-check.js

      - name: Remove updater and commit owner-file update
        run: |
          rm .github/workflows/store-card-containment-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-store-v1.css index.html scripts/live-smoke.mjs scripts/runtime-integrity-check.js .github/workflows/store-card-containment-update.yml
          git commit -m "Keep store Buy buttons inside character cards"
          git push origin HEAD:main
