name: Build Android Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - capacitor.config.json
      - android-native-v1.js
      - game.js
      - game-core-stable-v1.js
      - android-assets/**
      - scripts/install-android-icons.sh
      - scripts/materialize-core.js
      - .github/workflows/build-android-rc.yml

permissions:
  contents: read

jobs:
  android-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx cap --version

      - name: Verify reproducible offline game core
        run: |
          git fetch --no-tags origin 5b83840d68ad65939b8efae336afd76c47b7bdc1
          node scripts/materialize-core.js
          test -s game-core-stable-v1.js
          test "$(grep -c "CORE_RUNTIME = 'game-core-stable-v1.js?v=1'" game.js)" -eq 1
          ! grep -Eq 'cdn\.jsdelivr\.net|https?://' game-core-stable-v1.js
          node --check game-core-stable-v1.js
          node --check game.js
          node --check android-native-v1.js
          node scripts/runtime-integrity-check.js

      - name: Prepare clean native web bundle
        run: |
          rm -rf www android
          mkdir -p www
          rsync -a ./ www/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='android-assets/' \
            --exclude='www/' \
            --exclude='node_modules/' \
            --exclude='scripts/' \
            --exclude='*.md' \
            --exclude='diff.txt' \
            --exclude='fix.py' \
            --exclude='reconstruct_w3.py' \
            --exclude='last_edit.jsonl' \
            --exclude='character-lab-v2.html' \
            --exclude='character-preview-simple.html' \
            --exclude='characters-preview.html' \
            --exclude='cursed-obstacle-lab.html' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.json'
          test -s www/game-core-stable-v1.js
          test -f www/android-native-v1.js
          ! grep -Eq 'cdn\.jsdelivr\.net|https?://' www/game-core-stable-v1.js

      - name: Create Android project and sync plugins
        run: |
          npx cap add android
          npx cap sync android

      - name: Install approved Feather Fury launcher icons
        run: bash scripts/install-android-icons.sh "$GITHUB_WORKSPACE"

      - name: Verify Android 16, lifecycle plugin, and icon contract
        run: |
          grep -R "compileSdkVersion = 36\|compileSdk 36\|compileSdk = 36" android/variables.gradle android/app/build.gradle android/build.gradle
          grep -R "targetSdkVersion = 36\|targetSdk 36\|targetSdk = 36" android/variables.gradle android/app/build.gradle android/build.gradle
          grep -R "capacitor-app" android/app/capacitor.build.gradle android/capacitor.settings.gradle
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          grep -q '<monochrome android:drawable="@mipmap/ic_launcher_monochrome"' android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          test "$(identify -format '%wx%h' FeatherFury-GooglePlay-512.png)" = "512x512"

      - name: Build debug APK and unsigned release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Package RC artifacts
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FeatherFury-RC-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab FeatherFury-RC-unsigned.aab

      - name: Upload Android RC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FeatherFury-Android-RC
          if-no-files-found: error
          path: |
            FeatherFury-RC-debug.apk
            FeatherFury-RC-unsigned.aab
            FeatherFury-GooglePlay-512.png
