name: Build Android Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - capacitor.config.json
      - index.html
      - '*.js'
      - '*.css'
      - js/**
      - assets/**
      - manifest.json
      - icon.png
      - favicon.png
      - android-native-v1.js
      - game.js
      - game-core-stable-v1.js
      - scripts/android-icons/**
      - scripts/install-android-icons.sh
      - scripts/materialize-core.js
      - scripts/runtime-integrity-check.js
      - scripts/release-sync-trigger.txt
      - .github/workflows/live-runtime-verify.yml
      - .github/workflows/build-android-rc.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: feather-fury-android-rc
  cancel-in-progress: true

jobs:
  android-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install native build dependencies
        id: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          java -version
          npx cap --version

      - name: Verify reproducible offline game core
        id: core
        run: |
          git cat-file -e 5b83840d68ad65939b8efae336afd76c47b7bdc1:game.js
          node scripts/materialize-core.js
          test -s game-core-stable-v1.js
          test "$(grep -c "CORE_RUNTIME = 'game-core-stable-v1.js?v=1'" game.js)" -eq 1
          ! grep -Eq 'cdn\.jsdelivr\.net|https?://' game-core-stable-v1.js
          node --check game-core-stable-v1.js
          node --check game.js
          node --check android-native-v1.js
          node scripts/runtime-integrity-check.js

      - name: Prepare clean native web bundle
        id: webbundle
        run: |
          rm -rf www android
          mkdir -p www
          rsync -a ./ www/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='android-assets/' \
            --exclude='www/' \
            --exclude='node_modules/' \
            --exclude='scripts/' \
            --exclude='*.md' \
            --exclude='diff.txt' \
            --exclude='fix.py' \
            --exclude='reconstruct_w3.py' \
            --exclude='last_edit.jsonl' \
            --exclude='character-lab-v2.html' \
            --exclude='character-preview-simple.html' \
            --exclude='characters-preview.html' \
            --exclude='cursed-obstacle-lab.html' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.json'
          test -s www/game-core-stable-v1.js
          test -f www/android-native-v1.js
          ! grep -Eq 'cdn\.jsdelivr\.net|https?://' www/game-core-stable-v1.js

      - name: Create Android project and sync plugins
        id: capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Install approved Feather Fury launcher icons
        id: icons
        run: bash scripts/install-android-icons.sh "$GITHUB_WORKSPACE"

      - name: Verify Android 16, lifecycle plugin, and icon contract
        id: verify
        run: |
          grep -R "compileSdkVersion = 36\|compileSdk 36\|compileSdk = 36" android/variables.gradle android/app/build.gradle android/build.gradle
          grep -R "targetSdkVersion = 36\|targetSdk 36\|targetSdk = 36" android/variables.gradle android/app/build.gradle android/build.gradle
          grep -R "capacitor-app" android/app/capacitor.build.gradle android/capacitor.settings.gradle
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          grep -q '<monochrome android:drawable="@mipmap/ic_launcher_monochrome"' android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          test "$(identify -format '%wx%h' FeatherFury-GooglePlay-512.png)" = "512x512"
          test "$(stat -c%s FeatherFury-GooglePlay-512.png)" -le 1048576

      - name: Build debug APK and unsigned release AAB
        id: gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Package RC artifacts
        id: package
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FeatherFury-RC-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab FeatherFury-RC-unsigned.aab

      - name: Upload Android RC artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: FeatherFury-Android-RC
          if-no-files-found: error
          path: |
            FeatherFury-RC-debug.apk
            FeatherFury-RC-unsigned.aab
            FeatherFury-GooglePlay-512.png

      - name: Report Android RC build status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[ANDROID RC] Build Status';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const status = '${{ job.status }}';
            const body = [
              `Status: **${status.toUpperCase()}**`,
              '',
              `Commit: \`${context.sha}\``,
              `Run: ${runUrl}`,
              '',
              'Stage outcomes:',
              `- deps: ${{ steps.deps.outcome }}`,
              `- core: ${{ steps.core.outcome }}`,
              `- webbundle: ${{ steps.webbundle.outcome }}`,
              `- capacitor: ${{ steps.capacitor.outcome }}`,
              `- icons: ${{ steps.icons.outcome }}`,
              `- verify: ${{ steps.verify.outcome }}`,
              `- gradle: ${{ steps.gradle.outcome }}`,
              `- package: ${{ steps.package.outcome }}`,
              `- upload: ${{ steps.upload.outcome }}`,
              '',
              status === 'success'
                ? 'APK debug + unsigned release AAB + Google Play icon were built and uploaded as the `FeatherFury-Android-RC` artifact.'
                : 'Android RC did not complete. Open the run above to inspect the first failing step.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);
            const state = status === 'success' ? 'closed' : 'open';
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                state
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [],
              });
              if (status === 'success') {
                const { data: fresh } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
                const created = fresh.find(i => !i.pull_request && i.title === title);
                if (created) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: created.number, state: 'closed' });
              }
            }
