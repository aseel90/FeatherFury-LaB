name: Verify Live Feather Fury

on:
  workflow_run:
    workflows: ["Deploy LAB Preview"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feather-fury-live-verify
  cancel-in-progress: true

jobs:
  live-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deployed SHA
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Verify LIVE GitHub Pages runtime
        id: smoke
        env:
          FF_LIVE_URL: https://aseel90.github.io/FeatherFury-LaB/
          FF_VERIFY_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -o pipefail
          status=0
          echo "=== Chromium mobile ===" | tee ff-live-smoke.log
          FF_BROWSER=chromium FF_SMOKE_OUT=artifacts/live-smoke/chromium node scripts/live-smoke.mjs 2>&1 | tee -a ff-live-smoke.log || status=1
          echo "=== WebKit iPhone ===" | tee -a ff-live-smoke.log
          FF_BROWSER=webkit FF_SMOKE_OUT=artifacts/live-smoke/webkit node scripts/live-smoke.mjs 2>&1 | tee -a ff-live-smoke.log || status=1
          exit "$status"

      - name: Preserve live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feather-fury-live-smoke-${{ steps.meta.outputs.sha }}
          if-no-files-found: ignore
          path: |
            ff-live-smoke.log
            artifacts/live-smoke/**

      - name: Bridge live failure to issue
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          TITLE='[LIVE] Feather Fury deployment broken'
          ISSUE="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[LIVE] Feather Fury deployment broken") | .number' | head -n1)"
          {
            echo "Live browser verification failed for \`$SHA\`."
            echo
            echo "Run: https://github.com/$REPO/actions/runs/${{ github.run_id }}"
            echo
            echo '```text'
            tail -c 14000 ff-live-smoke.log || true
            echo
            echo '```'
          } > /tmp/ff-live-failure.md
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/ff-live-failure.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/ff-live-failure.md
          fi

      - name: Close recovered live failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          TITLE='[LIVE] Feather Fury deployment broken'
          ISSUE="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[LIVE] Feather Fury deployment broken") | .number' | head -n1)"
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --repo "$REPO" --comment "Live runtime recovered on \`$SHA\`: Loading → complete World Select → PLAY passed with no critical browser/runtime errors."
          fi

      - name: Report live verification status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[LIVE VERIFY] Runtime Status';
            const sha = '${{ steps.meta.outputs.sha }}';
            const outcome = '${{ steps.smoke.outcome }}';
            const label = outcome === 'success'
              ? 'SUCCESS'
              : outcome === 'failure'
                ? 'FAILURE'
                : outcome === 'cancelled'
                  ? 'CANCELLED'
                  : 'INCOMPLETE';
            const ok = outcome === 'success';
            const failed = outcome === 'failure';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const detail = ok
              ? 'Loading → complete World Select → PLAY and the canonical navigation smoke checks passed on the deployed GitHub Pages build.'
              : failed
                ? 'The deployed build did not pass the complete live browser smoke contract. See the run diagnostics and the open deployment failure issue.'
                : 'Verification did not finish. This status does not imply a runtime failure; use the next completed live run as the release verdict.';
            const body = [
              `Status: **${label}**`,
              '',
              `Deployed commit: \`${sha}\``,
              `Run: ${runUrl}`,
              '',
              'Browsers:',
              '- Chromium mobile',
              '- WebKit iPhone',
              '',
              detail
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);
            const state = ok ? 'closed' : 'open';
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                state
              });
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              if (ok) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: created.data.number,
                  state: 'closed'
                });
              }
            }
