name: Mirror Selyro 0.3.1 update

on:
  push:
    paths:
      - '.github/workflows/mirror-selyro-031.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download signed Selyro 0.3.1 APK
        run: |
          mkdir -p selyro-updates
          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/aseel90/iptv/64529356dfa460bf6541c1f0c321be511222d3a5/ci-artifacts/Selyro-TV-v0.3.1-polish.apk' \
            -o selyro-updates/Selyro-TV-v0.3.1-polish.apk

      - name: Verify APK checksum
        run: |
          echo '16d746a380d53650c3ea88a24c0f01a9017baaee9902c05b99e6687824dca0ef  selyro-updates/Selyro-TV-v0.3.1-polish.apk' | sha256sum -c -

      - name: Publish update manifest
        run: |
          cat > selyro-updates/latest.json <<'EOF'
          {
            "versionCode": 11,
            "versionName": "0.3.1-polish",
            "apkUrl": "https://raw.githubusercontent.com/aseel90/FeatherFury-LaB/main/selyro-updates/Selyro-TV-v0.3.1-polish.apk",
            "sha256": "16d746a380d53650c3ea88a24c0f01a9017baaee9902c05b99e6687824dca0ef",
            "notes": "Polish update: localized player controls with RTL/LTR support, cleaner TV remote layout, resume playback and visible progress, audio/subtitle track selection, stronger reconnect behavior, while preserving the new Selyro identity, launcher icon and TV banner."
          }
          EOF
          echo '16d746a380d53650c3ea88a24c0f01a9017baaee9902c05b99e6687824dca0ef  Selyro-TV-v0.3.1-polish.apk' > selyro-updates/Selyro-TV-v0.3.1-polish.sha256

      - name: Commit mirrored release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selyro-updates/Selyro-TV-v0.3.1-polish.apk \
                  selyro-updates/Selyro-TV-v0.3.1-polish.sha256 \
                  selyro-updates/latest.json
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'release(selyro): mirror signed 0.3.1 APK for public updates'
            git push
          fi
