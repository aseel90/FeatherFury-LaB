name: Verify Store Responsive Purchase Flow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: feather-fury-store-live-qa
  cancel-in-progress: true

jobs:
  store-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Wait for matching LAB deployment
        id: deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            row=$(gh run list --workflow deploy-pages.yml --commit "$SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] // empty')
            if [ -n "$row" ]; then
              status=$(printf '%s' "$row" | jq -r '.status')
              conclusion=$(printf '%s' "$row" | jq -r '.conclusion // ""')
              echo "Deploy status: $status ${conclusion:-}"
              if [ "$status" = 'completed' ]; then
                if [ "$conclusion" = 'success' ]; then
                  echo 'result=success' >> "$GITHUB_OUTPUT"
                  echo 'detail=Matching Pages deployment succeeded' >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo 'result=failure' >> "$GITHUB_OUTPUT"
                echo "detail=Matching Pages deployment concluded: $conclusion" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'result=failure' >> "$GITHUB_OUTPUT"
          echo 'detail=Timed out waiting for matching Pages deployment' >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.deploy.outputs.result == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.deploy.outputs.result == 'success'
        run: npm ci

      - name: Install browsers
        if: steps.deploy.outputs.result == 'success'
        run: npx playwright install --with-deps chromium webkit

      - name: Verify responsive store purchase flow
        if: steps.deploy.outputs.result == 'success'
        id: qa
        shell: bash
        env:
          FF_VERIFY_SHA: ${{ github.sha }}
        run: |
          set +e
          mkdir -p artifacts
          failed=0
          : > artifacts/store-qa.log
          for browser in chromium webkit; do
            echo "=== ${browser} ===" | tee -a artifacts/store-qa.log
            FF_BROWSER="$browser" FF_ARTIFACT_DIR="artifacts/store-${browser}" node scripts/live-store-qa.mjs 2>&1 | tee -a artifacts/store-qa.log
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then failed=1; fi
          done
          if [ "$failed" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FeatherFury-Store-Live-QA
          path: artifacts
          if-no-files-found: ignore

      - name: Report QA status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.qa.outputs.result }}
          QA_OUTCOME: ${{ steps.qa.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy.outputs.result }}
          DEPLOY_DETAIL: ${{ steps.deploy.outputs.detail }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title='[STORE QA] Responsive Purchase Status'
          if [ "$DEPLOY_RESULT" != 'success' ]; then RESULT='failure'; fi
          if [ "$QA_OUTCOME" = 'skipped' ] && [ "$DEPLOY_RESULT" = 'success' ]; then RESULT='failure'; fi
          num=$(gh issue list --state all --limit 100 --json number,title --jq '.[] | select(.title == "[STORE QA] Responsive Purchase Status") | .number' | head -1)
          if [ "$RESULT" = 'success' ]; then
            cat > /tmp/body.md <<BODY
          Status: **SUCCESS**

          Deployed commit: \`$SHA\`
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Browsers:
          - Chromium mobile
          - WebKit iPhone

          Verified live at 360x800, 390x844 and 412x915:
          - every purchase button remains inside its character card
          - purchase buttons retain a mobile touch target of at least 40px
          - shop list remains scrollable without escaping the viewport
          - buying a bird deducts and persists coins
          - purchased/unlocked skin and active skin persist after reload
          - switching to another owned bird persists after a second reload
          BODY
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file /tmp/body.md >/dev/null
              state=$(gh issue view "$num" --json state --jq '.state')
              if [ "$state" != 'CLOSED' ]; then gh issue close "$num" >/dev/null; fi
            else
              num=$(gh issue create --title "$title" --body-file /tmp/body.md | sed 's#.*/##')
              gh issue close "$num" >/dev/null
            fi
          else
            {
              echo 'Status: **FAILURE**'
              echo
              echo "Target commit: \`$SHA\`"
              echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo
              if [ "$DEPLOY_RESULT" != 'success' ]; then
                echo "Preflight: $DEPLOY_DETAIL"
              elif [ "$QA_OUTCOME" = 'skipped' ]; then
                echo 'QA step was skipped after deployment preflight; inspect the linked run for setup/install failure.'
              elif [ -f artifacts/store-qa.log ]; then
                echo '```text'
                tail -n 260 artifacts/store-qa.log
                echo '```'
              else
                echo 'QA failed without a store-qa.log; inspect the linked run.'
              fi
            } > /tmp/body.md
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file /tmp/body.md >/dev/null
              state=$(gh issue view "$num" --json state --jq '.state')
              if [ "$state" = 'CLOSED' ]; then gh issue reopen "$num" >/dev/null; fi
            else
              gh issue create --title "$title" --body-file /tmp/body.md >/dev/null
            fi
          fi

      - name: Fail if QA failed
        if: always() && (steps.deploy.outputs.result != 'success' || steps.qa.outputs.result != 'success')
        run: exit 1
