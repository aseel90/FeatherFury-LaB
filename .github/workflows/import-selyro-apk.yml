name: Import Selyro updater APK

on:
  push:
    paths:
      - '.github/workflows/import-selyro-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Selyro TV 0.3.4
        run: |
          mkdir -p selyro-updates
          curl --fail --location --retry 3 \
            -o selyro-updates/Selyro-TV-latest.apk \
            https://raw.githubusercontent.com/aseel90/iptv/9aa74fd4a6904f271d4a7d1f40de43d1f17326c0/ci-artifacts/Selyro-TV-v0.3.4-live-tv-ux.apk
          echo 'daf5e7bdc61d082ffd28eae49dd0216e54cf6b1478d8e7901ffdc7abf9dfef51  selyro-updates/Selyro-TV-latest.apk' | sha256sum -c -
      - name: Publish updater files
        run: |
          printf '%s  %s\n' 'daf5e7bdc61d082ffd28eae49dd0216e54cf6b1478d8e7901ffdc7abf9dfef51' 'Selyro-TV-latest.apk' > selyro-updates/Selyro-TV-latest.sha256
          cat > selyro-updates/latest.json <<'JSON'
          {
            "versionCode": 14,
            "versionName": "0.3.4-live-tv-ux",
            "apkUrl": "https://raw.githubusercontent.com/aseel90/FeatherFury-LaB/main/selyro-updates/Selyro-TV-latest.apk",
            "sha256": "daf5e7bdc61d082ffd28eae49dd0216e54cf6b1478d8e7901ffdc7abf9dfef51",
            "notes": "Live TV UX upgrade: smart Up/Down quick channel switching, in-player channel drawer, EPG/info panel, OK control hub with audio and subtitles, context-aware Back to the Live TV list, smoother player reuse while switching, and Selyro fallback artwork for missing or failed channel logos."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selyro-updates/Selyro-TV-latest.apk selyro-updates/Selyro-TV-latest.sha256 selyro-updates/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Selyro TV v0.3.4 Live TV UX'
          git push
