name: Import Selyro updater APK

on:
  push:
    paths:
      - '.github/workflows/import-selyro-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Selyro TV 0.4.2
        run: |
          set -euxo pipefail
          mkdir -p selyro-updates
          curl --fail --location --retry 3 \
            -o selyro-updates/Selyro-TV-latest.apk \
            https://raw.githubusercontent.com/aseel90/iptv/3a0f01cc279bb0cf568799753a0be55e5987b63a/ci-artifacts/Selyro-TV-v0.4.2-server-recent-hotfix.apk
          echo '5f32501c3292c528c35c32c4dc46bcb198d17cf60daa6d008ccb74a3c0cda542  selyro-updates/Selyro-TV-latest.apk' | sha256sum -c -
      - name: Publish updater files
        run: |
          set -euxo pipefail
          printf '%s  %s\n' '5f32501c3292c528c35c32c4dc46bcb198d17cf60daa6d008ccb74a3c0cda542' 'Selyro-TV-latest.apk' > selyro-updates/Selyro-TV-latest.sha256
          cat > selyro-updates/latest.json <<'JSON'
          {
            "versionCode": 22,
            "versionName": "0.4.2-server-recent-hotfix",
            "apkUrl": "https://raw.githubusercontent.com/aseel90/FeatherFury-LaB/main/selyro-updates/Selyro-TV-latest.apk",
            "sha256": "5f32501c3292c528c35c32c4dc46bcb198d17cf60daa6d008ccb74a3c0cda542",
            "notes": "Hotfix: server connection test now reports correctly using stable server IDs and performs a real Xtream login or M3U playlist check. Series episodes now appear in Recent after restarting the app and can continue from the saved position. Recent and Favorites also load movie metadata automatically."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selyro-updates/Selyro-TV-latest.apk selyro-updates/Selyro-TV-latest.sha256 selyro-updates/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Selyro TV v0.4.2 server recent hotfix'
          git push
