name: Import Selyro updater APK

on:
  push:
    paths:
      - '.github/workflows/import-selyro-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Selyro TV 0.3.6
        run: |
          mkdir -p selyro-updates
          curl --fail --location --retry 3 \
            -o selyro-updates/Selyro-TV-latest.apk \
            https://raw.githubusercontent.com/aseel90/iptv/98d6dadcd90b55977f0ff09d870d3ce9f6127860/ci-artifacts/Selyro-TV-v0.3.6-performance-ux.apk
          echo 'd469089aff8d3849fdee7b07528596f80a43af24b655a840ac8077248e9d9a7c  selyro-updates/Selyro-TV-latest.apk' | sha256sum -c -
      - name: Publish updater files
        run: |
          printf '%s  %s\n' 'd469089aff8d3849fdee7b07528596f80a43af24b655a840ac8077248e9d9a7c' 'Selyro-TV-latest.apk' > selyro-updates/Selyro-TV-latest.sha256
          cat > selyro-updates/latest.json <<'JSON'
          {
            "versionCode": 16,
            "versionName": "0.3.6-performance-ux",
            "apkUrl": "https://raw.githubusercontent.com/aseel90/FeatherFury-LaB/main/selyro-updates/Selyro-TV-latest.apk",
            "sha256": "d469089aff8d3849fdee7b07528596f80a43af24b655a840ac8077248e9d9a7c",
            "notes": "Performance and UX upgrade: guarded Live TV startup retries and timeout feedback, remembered last Live channel/category, unified Live/Movies/Series search with history, richer Now/Next EPG with local-time progress, Continue Watching and resume, Next Episode support, while preserving the validated lifecycle protections and remote-first Live UX."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selyro-updates/Selyro-TV-latest.apk selyro-updates/Selyro-TV-latest.sha256 selyro-updates/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Selyro TV v0.3.6 performance UX'
          git push
