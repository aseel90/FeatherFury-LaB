name: Import Selyro updater APK

on:
  push:
    paths:
      - '.github/workflows/import-selyro-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Selyro TV 0.3.9
        run: |
          mkdir -p selyro-updates
          curl --fail --location --retry 3 \
            -o selyro-updates/Selyro-TV-latest.apk \
            https://raw.githubusercontent.com/aseel90/iptv/c37adef61a4c6e3210711e1d72afe1897ab2e0cd/ci-artifacts/Selyro-TV-v0.3.9-stability-speed.apk
          echo 'ee907922ea8967c54d20f60a72d8593567fae5c0a156cfb0d8011be54cd57329  selyro-updates/Selyro-TV-latest.apk' | sha256sum -c -
      - name: Publish updater files
        run: |
          printf '%s  %s\n' 'ee907922ea8967c54d20f60a72d8593567fae5c0a156cfb0d8011be54cd57329' 'Selyro-TV-latest.apk' > selyro-updates/Selyro-TV-latest.sha256
          cat > selyro-updates/latest.json <<'JSON'
          {
            "versionCode": 19,
            "versionName": "0.3.9-stability-speed",
            "apkUrl": "https://raw.githubusercontent.com/aseel90/FeatherFury-LaB/main/selyro-updates/Selyro-TV-latest.apk",
            "sha256": "ee907922ea8967c54d20f60a72d8593567fae5c0a156cfb0d8011be54cd57329",
            "notes": "Stability & Speed: automatic server probes removed, connection testing is manual only, live quality and buffering UI are lighter, and prolonged live buffering now recovers through the existing reconnect path. PlayerFactory, streaming profiles, bitrate, decoder, stream URL logic, LoadControl values, and navigation icons are preserved."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selyro-updates/Selyro-TV-latest.apk selyro-updates/Selyro-TV-latest.sha256 selyro-updates/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Selyro TV v0.3.9 stability speed'
          git push
