name: Import Selyro updater APK

on:
  push:
    paths:
      - '.github/workflows/import-selyro-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Selyro TV 0.3.8
        run: |
          mkdir -p selyro-updates
          curl --fail --location --retry 3 \
            -o selyro-updates/Selyro-TV-latest.apk \
            https://raw.githubusercontent.com/aseel90/iptv/3f2bf01751e6867de9516da2e23a1e51199ed7a7/ci-artifacts/Selyro-TV-v0.3.8-navigation-icons.apk
          echo '5a3e429bf2b34f6b5c57e001bb13f88f6856f34f148593c5712a7a9bb02eb390  selyro-updates/Selyro-TV-latest.apk' | sha256sum -c -
      - name: Publish updater files
        run: |
          printf '%s  %s\n' '5a3e429bf2b34f6b5c57e001bb13f88f6856f34f148593c5712a7a9bb02eb390' 'Selyro-TV-latest.apk' > selyro-updates/Selyro-TV-latest.sha256
          cat > selyro-updates/latest.json <<'JSON'
          {
            "versionCode": 18,
            "versionName": "0.3.8-navigation-icons",
            "apkUrl": "https://raw.githubusercontent.com/aseel90/FeatherFury-LaB/main/selyro-updates/Selyro-TV-latest.apk",
            "sha256": "5a3e429bf2b34f6b5c57e001bb13f88f6856f34f148593c5712a7a9bb02eb390",
            "notes": "Navigation UI refresh with real vector icons (not emoji) for Home, Live TV, Movies, Series, Favorites, Recent and Settings. The sidebar remains permanently visible with icon + text, stronger TV focus states and no folding/collapsing behavior. Playback engine, bitrate, decoder, buffer profiles, server management, favorites and connection-quality behavior remain unchanged from 0.3.7."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selyro-updates/Selyro-TV-latest.apk selyro-updates/Selyro-TV-latest.sha256 selyro-updates/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Selyro TV v0.3.8 navigation icons'
          git push
