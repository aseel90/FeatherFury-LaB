name: Import Selyro updater APK

on:
  push:
    paths:
      - '.github/workflows/import-selyro-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Selyro TV 0.3.7
        run: |
          mkdir -p selyro-updates
          curl --fail --location --retry 3 \
            -o selyro-updates/Selyro-TV-latest.apk \
            https://raw.githubusercontent.com/aseel90/iptv/4a1341c92e59c8d846aa83d9b4900e975d13adac/ci-artifacts/Selyro-TV-v0.3.7-management-favorites-quality.apk
          echo '0a64cd30cdfc7a417349ba91c09d9203fa33e75bd8532395c89b9d9276e2c60a  selyro-updates/Selyro-TV-latest.apk' | sha256sum -c -
      - name: Publish updater files
        run: |
          printf '%s  %s\n' '0a64cd30cdfc7a417349ba91c09d9203fa33e75bd8532395c89b9d9276e2c60a' 'Selyro-TV-latest.apk' > selyro-updates/Selyro-TV-latest.sha256
          cat > selyro-updates/latest.json <<'JSON'
          {
            "versionCode": 17,
            "versionName": "0.3.7-management-favorites-quality",
            "apkUrl": "https://raw.githubusercontent.com/aseel90/FeatherFury-LaB/main/selyro-updates/Selyro-TV-latest.apk",
            "sha256": "0a64cd30cdfc7a417349ba91c09d9203fa33e75bd8532395c89b9d9276e2c60a",
            "notes": "Server management upgrade with edit and delete confirmations including the last saved server, direct Live channel favorites with visible star controls, saved-server latency health checks, and active playback connection-quality indicators based on startup time, buffering and playback errors. Preserves the 0.3.6 performance/UX improvements and lifecycle protections."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selyro-updates/Selyro-TV-latest.apk selyro-updates/Selyro-TV-latest.sha256 selyro-updates/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Selyro TV v0.3.7 management favorites quality'
          git push
