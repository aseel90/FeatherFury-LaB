name: Import Selyro updater APK

on:
  push:
    paths:
      - '.github/workflows/import-selyro-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Selyro TV 0.3.9
        run: |
          mkdir -p selyro-updates
          curl --fail --location --retry 3 \
            -o selyro-updates/Selyro-TV-latest.apk \
            https://raw.githubusercontent.com/aseel90/iptv/f4ff1537daa5ead92865768e6be8b98b767853c0/ci-artifacts/Selyro-TV-v0.3.9-stability-speed.apk
          echo '66316aebd7a5f52cf14d637e41121fa570b77389b134e4ead2b87c848f1fda68  selyro-updates/Selyro-TV-latest.apk' | sha256sum -c -
      - name: Publish updater files
        run: |
          printf '%s  %s\n' '66316aebd7a5f52cf14d637e41121fa570b77389b134e4ead2b87c848f1fda68' 'Selyro-TV-latest.apk' > selyro-updates/Selyro-TV-latest.sha256
          cat > selyro-updates/latest.json <<'JSON'
          {
            "versionCode": 19,
            "versionName": "0.3.9-stability-speed",
            "apkUrl": "https://raw.githubusercontent.com/aseel90/FeatherFury-LaB/main/selyro-updates/Selyro-TV-latest.apk",
            "sha256": "66316aebd7a5f52cf14d637e41121fa570b77389b134e4ead2b87c848f1fda68",
            "notes": "Stability & Speed: automatic server probes removed, connection testing is manual only, the live quality indicator is lighter, and buffering uses a small spinner with Media3 buffered duration when reliable. Playback engine, bitrate, decoder, stream URL logic, buffer profiles, and navigation icons remain unchanged."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selyro-updates/Selyro-TV-latest.apk selyro-updates/Selyro-TV-latest.sha256 selyro-updates/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Selyro TV v0.3.9 stability speed'
          git push
