name: Import Selyro updater APK

on:
  push:
    paths:
      - '.github/workflows/import-selyro-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Selyro TV 0.4.1
        run: |
          set -euxo pipefail
          mkdir -p selyro-updates
          curl --fail --location --retry 3 \
            -o selyro-updates/Selyro-TV-latest.apk \
            https://raw.githubusercontent.com/aseel90/iptv/51f30026ceb0156936478402e49a353cac3218cd/ci-artifacts/Selyro-TV-v0.4.1-resume-search-ux.apk
          echo 'c12c0f88fea87b31c8cb4d81a9bdd788203253c45e87cc546b09135c6c1ec068  selyro-updates/Selyro-TV-latest.apk' | sha256sum -c -
      - name: Publish updater files
        run: |
          set -euxo pipefail
          printf '%s  %s\n' 'c12c0f88fea87b31c8cb4d81a9bdd788203253c45e87cc546b09135c6c1ec068' 'Selyro-TV-latest.apk' > selyro-updates/Selyro-TV-latest.sha256
          cat > selyro-updates/latest.json <<'JSON'
          {
            "versionCode": 21,
            "versionName": "0.4.1-resume-search-ux",
            "apkUrl": "https://raw.githubusercontent.com/aseel90/FeatherFury-LaB/main/selyro-updates/Selyro-TV-latest.apk",
            "sha256": "c12c0f88fea87b31c8cb4d81a9bdd788203253c45e87cc546b09135c6c1ec068",
            "notes": "Resume and TV search UX: movies and episodes keep their watch position after closing the app. Reopening partially watched content offers Continue from the saved time or Start over. Search no longer opens the keyboard while navigating with the remote; the keyboard opens only after pressing the search box."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selyro-updates/Selyro-TV-latest.apk selyro-updates/Selyro-TV-latest.sha256 selyro-updates/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Selyro TV v0.4.1 resume search UX'
          git push
