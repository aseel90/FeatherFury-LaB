name: Import Selyro updater APK

on:
  push:
    paths:
      - '.github/workflows/import-selyro-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Selyro TV 0.3.2
        run: |
          mkdir -p selyro-updates
          curl --fail --location --retry 3 \
            -o selyro-updates/Selyro-TV-latest.apk \
            https://raw.githubusercontent.com/aseel90/iptv/4eb9e05a4b3d343e5068fe982ec82a625b24dbde/ci-artifacts/Selyro-TV-v0.3.2-icon-hotfix.apk
          echo '7be356d88211a60c721d599edae1dfb56d52962bee5e960b0ab7552fdbfd0f49  selyro-updates/Selyro-TV-latest.apk' | sha256sum -c -
      - name: Publish updater files
        run: |
          printf '%s  %s\n' '7be356d88211a60c721d599edae1dfb56d52962bee5e960b0ab7552fdbfd0f49' 'Selyro-TV-latest.apk' > selyro-updates/Selyro-TV-latest.sha256
          cat > selyro-updates/latest.json <<'JSON'
          {
            "versionCode": 12,
            "versionName": "0.3.2-icon-hotfix",
            "apkUrl": "https://raw.githubusercontent.com/aseel90/FeatherFury-LaB/main/selyro-updates/Selyro-TV-latest.apk",
            "sha256": "7be356d88211a60c721d599edae1dfb56d52962bee5e960b0ab7552fdbfd0f49",
            "notes": "Android TV launcher icon hotfix: replaces the TV launch point with density-specific raster artwork for Xiaomi/Google TV launchers while preserving the Selyro identity, TV banner, and all 0.3.1 playback polish."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selyro-updates/Selyro-TV-latest.apk selyro-updates/Selyro-TV-latest.sha256 selyro-updates/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Selyro TV v0.3.2 icon hotfix'
          git push
