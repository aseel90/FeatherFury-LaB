name: Install World Thumbnails

on:
  push:
    paths:
      - 'assets/ui/world-thumbnails-staging/*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode staged WebP thumbnails
        shell: bash
        run: |
          shopt -s nullglob
          files=(assets/ui/world-thumbnails-staging/*.b64)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No staged thumbnails to install.'
            exit 0
          fi
          mkdir -p assets/ui/world-thumbnails
          for f in "${files[@]}"; do
            name="$(basename "$f" .b64)"
            base64 -d "$f" > "assets/ui/world-thumbnails/$name"
          done
          rm -f assets/ui/world-thumbnails-staging/*.b64
      - name: Commit installed thumbnails
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/world-thumbnails assets/ui/world-thumbnails-staging
          git commit -m 'Install optimized world thumbnails'
          git push
