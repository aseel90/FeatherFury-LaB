name: Install World Thumbnails

on:
  push:
    paths:
      - 'assets/ui/world-thumbnails-staging/*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode staged WebP thumbnails
        shell: bash
        run: |
          shopt -s nullglob
          parts=(assets/ui/world-thumbnails-staging/*.b64)
          if [ ${#parts[@]} -eq 0 ]; then
            echo 'No staged thumbnails to install.'
            exit 0
          fi
          mkdir -p assets/ui/world-thumbnails
          for n in 1 2 3 4; do
            chunks=(assets/ui/world-thumbnails-staging/world-${n}.webp.part*.b64)
            if [ ${#chunks[@]} -gt 0 ]; then
              cat "${chunks[@]}" | base64 -d > "assets/ui/world-thumbnails/world-${n}.webp"
            elif [ -f "assets/ui/world-thumbnails-staging/world-${n}.webp.b64" ]; then
              base64 -d "assets/ui/world-thumbnails-staging/world-${n}.webp.b64" > "assets/ui/world-thumbnails/world-${n}.webp"
            fi
          done
          rm -f assets/ui/world-thumbnails-staging/*.b64
      - name: Commit installed thumbnails
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/world-thumbnails assets/ui/world-thumbnails-staging
          git commit -m 'Install optimized world thumbnails'
          git push
