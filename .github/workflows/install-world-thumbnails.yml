name: Install World Thumbnails

on:
  push:
    paths:
      - 'assets/ui/world-thumbnails-staging/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode staged WebP thumbnails
        shell: bash
        run: |
          if [ ! -f assets/ui/world-thumbnails-staging/READY ]; then
            echo 'Upload is not marked ready.'
            exit 0
          fi
          shopt -s nullglob
          mkdir -p assets/ui/world-thumbnails
          for n in 1 2 3 4; do
            chunks=(assets/ui/world-thumbnails-staging/world-${n}.webp.part*.b64)
            if [ ${#chunks[@]} -eq 0 ]; then
              echo "Missing chunks for world ${n}"
              exit 1
            fi
            cat "${chunks[@]}" | base64 -d > "assets/ui/world-thumbnails/world-${n}.webp"
          done
          rm -rf assets/ui/world-thumbnails-staging
      - name: Commit installed thumbnails
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/world-thumbnails assets/ui/world-thumbnails-staging
          git commit -m 'Install optimized world thumbnails'
          git push
