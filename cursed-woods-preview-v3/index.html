<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Feather Fury — Cursed Woods Preview</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#060a08;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:14px}.wrap{max-width:1180px;margin:auto}h1{font-size:20px;margin:0 0 5px}.sub{font-size:12px;color:#91a095;margin:0 0 12px}.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 12px;background:linear-gradient(#060a08 72%,transparent)}button{border:1px solid #39483d;background:#121a15;color:#f5f2f5;border-radius:9px;padding:9px 12px;font-weight:700}button.active{border-color:#9c6bd0;background:#271d30}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{background:#0b110e;border:1px solid #263129;border-radius:14px;padding:10px;box-shadow:0 10px 32px #0008}.title{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}.title strong{font-size:13px}.seed{font:10px ui-monospace;color:#7f8d83}canvas{display:block;width:100%;height:auto;aspect-ratio:360/640;border-radius:10px;background:#07100c}.legend{font-size:10px;color:#7f8d83;margin-top:10px}@media(max-width:560px){body{padding:9px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>Feather Fury — Cursed Woods</h1><p class="sub">Dark forest atmosphere · 360×640 · gap 154 · procedural tree obstacles</p><div class="toolbar"><button id="animate">Animate</button><button id="debug">Debug Hitbox</button><button id="seed">Randomize Seed</button></div><div id="grid" class="grid"></div><div class="legend">Forest layers + cursed fog + moonlight + glowing spores + hidden eyes. Yellow = visual obstacle contour · red = collision approximation.</div></div><script>
(()=>{'use strict';const W=360,H=640,G=545,GAP=154;let running=false,debug=false,seedBase=(Date.now()>>>0)||1,start=performance.now();const variants=[['A','Twisted Trunk'],['B','Runed Trunk'],['C','Thorned Cursed Tree'],['D','Ruined Forest Totem']];const cards=[];
function rng(seed){let s=seed>>>0||1;return()=>{s+=0x6D2B79F5;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function tree(ctx,x,base,h,w,bend,a,layer){ctx.save();ctx.globalAlpha=a;const c=layer===0?'#0b1a13':layer===1?'#07130e':'#040b08';ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x-w*.44,base);ctx.bezierCurveTo(x-w*.42,base-h*.22,x-w*.15+bend*.35,base-h*.62,x+bend,base-h);ctx.bezierCurveTo(x+w*.16+bend*.45,base-h*.82,x+w*.4+bend*.15,base-h*.28,x+w*.36,base);ctx.closePath();ctx.fill();const y=base-h*.58;ctx.lineWidth=layer===2?7:5;ctx.beginPath();ctx.moveTo(x+bend*.35,y);ctx.quadraticCurveTo(x-w*.8,y-22,x-w*1.22,y-70);ctx.moveTo(x+bend*.2,y+12);ctx.quadraticCurveTo(x+w*.78,y-5,x+w*1.18,y-58);ctx.moveTo(x+bend*.08,y-40);ctx.quadraticCurveTo(x-w*.25,y-74,x-w*.05,y-118);ctx.stroke();ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-w*.7,y-34);ctx.lineTo(x-w*1.4,y-50);ctx.moveTo(x+w*.68,y-30);ctx.lineTo(x+w*1.42,y-44);ctx.stroke();ctx.restore()}
function fog(ctx,y,h,t,p,a,c){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(-30,y+h*.5);for(let x=-30;x<390;x+=24){const wave=Math.sin(x*.024+t*.42+p)*8+Math.cos(x*.015-t*.3+p)*4;ctx.quadraticCurveTo(x+12,y+wave,x+24,y+h*.5+wave*.45)}ctx.lineTo(390,y+h);ctx.lineTo(-30,y+h);ctx.closePath();ctx.fill();ctx.restore()}
function background(ctx,t,index){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#06100d');sky.addColorStop(.38,'#0b1915');sky.addColorStop(.75,'#111713');sky.addColorStop(1,'#14140f');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const mg=ctx.createRadialGradient(288,92,6,288,92,100);mg.addColorStop(0,'#d9c8ff42');mg.addColorStop(.42,'#754e9c22');mg.addColorStop(1,'#0000');ctx.fillStyle=mg;ctx.fillRect(185,0,175,180);ctx.save();ctx.globalAlpha=.65;ctx.fillStyle='#d6d1e4';ctx.beginPath();ctx.arc(288,92,15,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(295,88,14,0,Math.PI*2);ctx.fill();ctx.restore();
for(let i=0;i<7;i++)tree(ctx,12+i*58,G+5,180+(i%3)*35,35+(i%2)*6,(i%2?-1:1)*(5+i%3*3),.25,0);fog(ctx,165,46,t,index*.4,.09,'#58436c');
for(let i=0;i<5;i++)tree(ctx,30+i*78,G+6,235+(i%2)*28,46+(i%3)*5,(i%2?-10:9),.42,1);fog(ctx,400,55,t,-index*.6,.12,'#40374f');
ctx.save();ctx.strokeStyle='#0a17118f';ctx.lineCap='round';for(let i=0;i<8;i++){const x=12+i*49,s=Math.sin(t*.7+i+index)*4;ctx.lineWidth=2+(i%2);ctx.beginPath();ctx.moveTo(x,-5);ctx.bezierCurveTo(x+s,28,x-7+s,62,x+2+s,100+(i%3)*16);ctx.stroke()}ctx.restore();
for(let i=0;i<13;i++){const x=16+i*27+Math.sin(t*.7+i*1.7+index)*7,y=110+(i%5)*70+Math.cos(t*.9+i)*11,p=i%3!==0;ctx.save();ctx.globalAlpha=.32;ctx.shadowColor=p?'#c27aff':'#74d99a';ctx.shadowBlur=7;ctx.fillStyle=p?'#d79cff':'#8ee3aa';ctx.beginPath();ctx.arc(x,y,1.3+(i%2)*.5,0,Math.PI*2);ctx.fill();ctx.restore()}
function eyes(x,y,ph){const b=(Math.sin(t*2.4+ph)+1)*.5<.08?.2:1;ctx.save();ctx.globalAlpha=.45;ctx.shadowColor='#c77aff';ctx.shadowBlur=8;ctx.fillStyle='#e1b0ff';ctx.beginPath();ctx.ellipse(x-5,y,2.2,1.4*b,0,0,Math.PI*2);ctx.ellipse(x+5,y,2.2,1.4*b,0,0,Math.PI*2);ctx.fill();ctx.restore()}eyes(50,430,index);eyes(306,382,index+1.3);
ctx.fillStyle='#171b14';ctx.fillRect(0,G,W,H-G);ctx.fillStyle='#273126';ctx.fillRect(0,G,W,6);fog(ctx,G-26,34,t,index*.8,.15,'#553d72');
ctx.save();ctx.globalAlpha=.62;ctx.strokeStyle='#030806';ctx.lineCap='round';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(-10,115);ctx.bezierCurveTo(45,120,66,80,112,100);ctx.moveTo(370,165);ctx.bezierCurveTo(318,158,300,122,254,142);ctx.stroke();ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(62,100);ctx.lineTo(88,62);ctx.moveTo(305,142);ctx.lineTo(280,103);ctx.stroke();ctx.restore()}
function obstacle(seed,variant,top){const r=rng(seed);const width=56+(variant==='D'?7:variant==='A'?-2:2),cx=278;function spine(y0,y1,part){const pts=[],n=7,phase=r()*Math.PI*2;for(let i=0;i<n;i++){const q=i/(n-1),y=y0+(y1-y0)*q,en=.45+.55*Math.sin(Math.PI*q),x=cx+Math.sin(q*Math.PI*2+phase)*13*en+(r()-.5)*6,rad=width*.5+(r()-.5)*6+(part==='bottom'&&q>.72?6*q:0);pts.push({x,y,rad})}return pts}return{seed,variant,top,topPts:spine(0,top,'top'),botPts:spine(top+GAP,G,'bottom'),phase:r()*6.28}}
function interp(pts,t){const f=t*(pts.length-1),i=Math.floor(f),j=Math.min(pts.length-1,i+1),q=f-i,a=pts[i],b=pts[j];return{x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q,rad:a.rad+(b.rad-a.rad)*q}}
function pathFrom(ctx,pts,part,offset){const samples=[];for(let i=0;i<=36;i++)samples.push(interp(pts,i/36));const left=[],right=[];for(let i=0;i<samples.length;i++){const a=samples[Math.max(0,i-1)],b=samples[Math.min(samples.length-1,i+1)],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,p=samples[i];left.push({x:p.x+nx*p.rad,y:p.y+ny*p.rad+offset});right.push({x:p.x-nx*p.rad,y:p.y-ny*p.rad+offset})}ctx.beginPath();ctx.moveTo(left[0].x,left[0].y);for(let i=1;i<left.length;i++)ctx.lineTo(left[i].x,left[i].y);for(let i=right.length-1;i>=0;i--)ctx.lineTo(right[i].x,right[i].y);ctx.closePath();return{samples,left,right}}
function drawObstacle(ctx,o,t){const off=running?Math.sin(t*1.15+o.phase)*20:0;for(const [pts,part] of [[o.topPts,'top'],[o.botPts,'bottom']]){pathFrom(ctx,pts,part,off);const grd=ctx.createLinearGradient(240,0,315,0);grd.addColorStop(0,'#2d190f');grd.addColorStop(.48,'#68402a');grd.addColorStop(1,'#321b12');ctx.fillStyle=grd;ctx.fill();ctx.strokeStyle='#1c0e0a';ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle='#93613c66';ctx.lineWidth=1;ctx.stroke();
ctx.strokeStyle='#1e100bc9';ctx.lineWidth=2;for(let k=0;k<4;k++){const p=interp(pts,.18+k*.18);ctx.beginPath();ctx.moveTo(p.x-7,p.y+off-10);ctx.bezierCurveTo(p.x+2,p.y+off-2,p.x-5,p.y+off+9,p.x+5,p.y+off+17);ctx.stroke()}
if(o.variant==='B'||o.variant==='D'){const p=interp(pts,.52);ctx.save();ctx.shadowColor='#b55cff';ctx.shadowBlur=8;ctx.strokeStyle='#c27aff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y+off-13);ctx.lineTo(p.x+5,p.y+off);ctx.lineTo(p.x-4,p.y+off+12);ctx.stroke();ctx.restore()}
if(o.variant==='C'){const p=interp(pts,.38);ctx.strokeStyle='#27130d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x-22,p.y+off);ctx.lineTo(p.x-39,p.y+off+(part==='top'?-10:10));ctx.moveTo(p.x+22,p.y+off+18);ctx.lineTo(p.x+39,p.y+off+(part==='top'?8:28));ctx.stroke()}
if(o.variant==='D'){const p=interp(pts,.65);ctx.fillStyle='#57545c';ctx.strokeStyle='#29272d';ctx.lineWidth=2;ctx.beginPath();ctx.rect(p.x+13,p.y+off-7,13,11);ctx.fill();ctx.stroke()}
if(debug){ctx.strokeStyle='#ffd95b';ctx.lineWidth=1;pathFrom(ctx,pts,part,off);ctx.stroke();ctx.strokeStyle='#ff536c66';ctx.lineWidth=18;ctx.beginPath();for(let i=0;i<6;i++){const a=interp(pts,i/6),b=interp(pts,(i+1)/6);ctx.moveTo(a.x,a.y+off);ctx.lineTo(b.x,b.y+off)}ctx.stroke()}}
ctx.save();ctx.setLineDash([5,4]);ctx.strokeStyle='#69e99199';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,o.top+off);ctx.lineTo(W,o.top+off);ctx.moveTo(0,o.top+GAP+off);ctx.lineTo(W,o.top+GAP+off);ctx.stroke();ctx.restore()}
function bird(ctx){ctx.save();ctx.translate(92,315);ctx.fillStyle='#e7c43b';ctx.strokeStyle='#191916';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,-3,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(6.5,-3,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e78434';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(23,4);ctx.lineTo(12,8);ctx.closePath();ctx.fill();ctx.restore()}
function build(){const grid=document.getElementById('grid');grid.innerHTML='';cards.length=0;variants.forEach((v,i)=>{const card=document.createElement('section');card.className='card';const title=document.createElement('div');title.className='title';const s=document.createElement('strong');s.textContent=`${v[0]} · ${v[1]}`;const sd=document.createElement('span');sd.className='seed';title.append(s,sd);const c=document.createElement('canvas');c.width=W;c.height=H;card.append(title,c);grid.append(card);const seed=(seedBase+Math.imul(i+1,0x9e3779b1))>>>0,o=obstacle(seed,v[0],220+(i%2)*28);sd.textContent=`seed ${seed}`;cards.push({ctx:c.getContext('2d'),o,sd,i})})}
function frame(now){const t=(now-start)/1000;for(const c of cards){background(c.ctx,t,c.i);drawObstacle(c.ctx,c.o,t);bird(c.ctx)}window.__forestPreviewStatus={ready:true,treesPerScene:12,canvases:cards.length};requestAnimationFrame(frame)}
document.getElementById('animate').onclick=e=>{running=!running;start=performance.now();e.currentTarget.classList.toggle('active',running)};document.getElementById('debug').onclick=e=>{debug=!debug;e.currentTarget.classList.toggle('active',debug)};document.getElementById('seed').onclick=()=>{seedBase=(Math.random()*0xffffffff)>>>0;build()};build();requestAnimationFrame(frame)})();
</script></body></html>
